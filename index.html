/* ---------- spending by category: this month vs before, with tips that use your own numbers ---------- */
function catAnalysis(){
  var c=curYM(),day=Number(todayISO().slice(8,10)),dim=daysIn(c),now=catTotals(c),last=catTotals(addMonths(c,-1)),hist={};
  [1,2,3].forEach(function(i){var t=catTotals(addMonths(c,-i));Object.keys(t).forEach(function(k){hist[k]=(hist[k]||[]).concat([t[k]]);});});
  var keys={};Object.keys(now).concat(Object.keys(last)).concat(Object.keys(hist)).forEach(function(k){keys[k]=1;});
  var tot=sum(Object.keys(now),function(k){return now[k];});
  return Object.keys(keys).map(function(k){
    var h=hist[k]||[],avg=h.length?sum(h)/3:0,n=now[k]||0,fixed=/מנויים|דיור|חשבונות/.test(k);
    var pace=fixed?Math.max(n,avg):n+avg*(dim-day)/dim,seen=h.filter(function(v){return v>0;}).length;
    return {cat:k,now:r2(n),last:r2(last[k]||0),avg:r2(avg),pace:r2(pace),share:tot?n/tot:0,chg:avg>0&&seen>=1?(pace-avg)/avg:null};
  }).filter(function(x){return x.now>0||x.avg>0;}).sort(function(a,b){return Math.max(b.now,b.avg)-Math.max(a.now,a.avg);});
}
function catTip(x){
  var p=prof(),base=Math.max(x.avg,x.pace,x.now),y=function(f){return money(Math.round(base*f*12));},k=x.cat;
  if(/מזון|סופר/.test(k))return L('קנייה לפי רשימה פעם בשבוע, מותג פרטי ורשת מוזלת חוסכים בדרך כלל 10%–15% — אצלך כ-')+y(0.12)+L(' בשנה.')+(p.household==='parents'?L(' גר עם ההורים? סכמו חלוקה קבועה של הקניות.'):'');
  if(/מסעד|בילוי/.test(k))return L('קבע תקרה של ')+money(Math.round(base*0.7))+L(' בחודש ואוכל מהבית לימי ')+(p.studying?L('לימודים'):L('עבודה'))+L(' — חיסכון של כ-')+y(0.3)+L(' בשנה.');
  if(/מנויים/.test(k)){var su=state.future.filter(function(f){return f.type==='monthly';});return su.length?su.length+L(' מנויים קבועים = ')+money(Math.round(sum(su,function(f){return f.amount;})*12))+L(' בשנה. עבור על כל אחד: השתמשת בו החודש? אם לא — בטל לפני החיוב הבא, או עבור לתשלום שנתי זול יותר.'):L('בדוק אילו מנויים באמת בשימוש — כל ביטול נחסך כל חודש.');}
  if(/דלק|רכב/.test(k))return hasCar()?L('השוואת תחנות לפני תדלוק והחזר נסיעות מהמעסיק — הפירוט המלא בניתוח הדלק למטה.'):L('יש הוצאות רכב, אבל בפרופיל כתוב שאין רכב — כדאי לעדכן בפרופיל.');
  if(/תחבורה/.test(k))return (p.studying?L('ודא שפרופיל סטודנט מופעל ברב-קו — הוא נותן הנחה בנסיעות. '):'')+L('בדוק אם מנוי חודשי זול מתשלום לפי נסיעה בהיקף שלך.');
  if(/חשבונות/.test(k))return L('סלולר: חבילה של כ-30 ₪ לקו מספיקה לרוב. חשמל: ספק פרטי נותן 5%–7% הנחה. שיחה אחת לחברה בשנה = כ-')+y(0.1)+L(' בשנה.');
  if(/ביגוד|הנעלה/.test(k))return L('כלל 48 השעות: לפני קנייה לא מתוכננת מעל 150 ₪ — לחכות יומיים. קניות בסוף עונה זולות ב-30%–50%.');
  if(/קניות לבית/.test(k))return L('השוואת מחיר לפני כל קנייה מעל 200 ₪ (זאפ / השוואת מחירים) וכלל 48 השעות.');
  if(/בריאות/.test(k))return L('בקש תרופה גנרית במקום מותג, ובדוק מה הביטוח המשלים בקופה מחזיר לפני תשלום פרטי.');
  if(/לימודים/.test(k))return L('ספרים משומשים, הנחות סטודנט, ובדיקת מלגות (למשל דרך דיקנאט הסטודנטים) לפני כל תשלום.');
  if(/מתנות/.test(k))return L('קבע תקציב מתנות שנתי (ימי הולדת + חגים) וחלק ל-12 — ככה אין הפתעות בחודשים עמוסים.');
  if(/דיור|שכירות/.test(k))return L('הוצאה קבועה — בדוק פעם בשנה מול מחירי השוק באזור לפני חידוש חוזה.');

/* ---------- personal account: name + password (8+ chars), fingerprint, encrypted auto-backup (phone/PC app) ---------- */
var LOCK_KEY='kesef-lock',locked=false,lockInput='',lockTries=0,lockUntil=0,hiddenAt=0,needAccount=false,ACC_ITER=150000;
function lockCfg(){try{return JSON.parse(localStorage.getItem(LOCK_KEY)||'null');}catch(e){return null;}}
function lockSave(c){try{if(c)localStorage.setItem(LOCK_KEY,JSON.stringify(c));else localStorage.removeItem(LOCK_KEY);}catch(e){}}
function lockAvailable(){return STANDALONE&&!!(window.crypto&&crypto.subtle);}
function hx(buf){return Array.prototype.map.call(new Uint8Array(buf),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');}
function unhx(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a;}
function b64(u8){var s='';for(var i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s);}
function unb64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
/* PBKDF2 → 64 bytes: first half checks the password, second half is the backup encryption key */
function derive(pw,saltHex,iter){return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',salt:unhx(saltHex),iterations:iter,hash:'SHA-256'},k,512);}).then(function(b){var u=new Uint8Array(b);return {ver:hx(u.slice(0,32)),key:hx(u.slice(32))};});}
function aesKey(hexKey){return crypto.subtle.importKey('raw',unhx(hexKey),'AES-GCM',false,['encrypt','decrypt']);}
function encryptState(c){var iv=crypto.getRandomValues(new Uint8Array(12));return aesKey(c.bkey).then(function(k){return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,new TextEncoder().encode(JSON.stringify(state)));}).then(function(ct){return JSON.stringify({app:'kesef',v:1,name:c.name||'',at:new Date().toISOString(),salt:c.salt,iter:c.iter,iv:b64(iv),ct:b64(new Uint8Array(ct))});});}
function decryptBackup(txt,pw){var o=JSON.parse(txt);if(!o||o.app!=='kesef'||!o.ct)throw new Error('format');return derive(pw,o.salt,o.iter||ACC_ITER).then(function(d){return aesKey(d.key).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},k,unb64(o.ct));}).then(function(pt){return {state:JSON.parse(new TextDecoder().decode(pt)),name:o.name,salt:o.salt,iter:o.iter||ACC_ITER,d:d};});});}
function bioPlugin(){var CP=window.Capacitor;return CP&&CP.isNativePlatform&&CP.isNativePlatform()&&CP.Plugins&&CP.Plugins.NativeBiometric||null;}
function fsPlugin(){var CP=window.Capacitor;return CP&&CP.isNativePlatform&&CP.isNativePlatform()&&CP.Plugins&&CP.Plugins.Filesystem||null;}
function tryBio(){var B=bioPlugin(),c=lockCfg();if(!B||!c||!c.bio||c.legacy)return;
  B.isAvailable().then(function(r){if(!r||!r.isAvailable)return;return B.verifyIdentity({reason:L('פתיחת הכסף שלי'),title:L('הכסף שלי'),subtitle:L('אימות בטביעת אצבע'),negativeButtonText:L('סיסמה')}).then(function(){unlock();});}).catch(function(){});}
function unlock(){locked=false;lockInput='';lockTries=0;ui.lockErr='';render();setTimeout(extBackup,3000);}
/* ---- encrypted copy outside the app (Documents/HaKesefSheli) — survives uninstall ---- */
var extT=null;
function extBackupSoon(){clearTimeout(extT);extT=setTimeout(extBackup,5000);}
function extBackup(){
  var FS=fsPlugin(),c=lockCfg();if(!FS||!c||!c.bkey||locked)return;
  encryptState(c).then(function(txt){
    var day=todayISO();var name=localStorage.getItem('kesef-extname')||'HaKesefSheli/kesef-backup.kesef';
    return FS.writeFile({path:name,data:txt,directory:'DOCUMENTS',encoding:'utf8',recursive:true}).catch(function(){
      name='HaKesefSheli/kesef-backup-'+day+'-'+Math.random().toString(36).slice(2,6)+'.kesef';
      return FS.writeFile({path:name,data:txt,directory:'DOCUMENTS',encoding:'utf8',recursive:true}).then(function(){try{localStorage.setItem('kesef-extname',name);}catch(e){}});
    }).then(function(){try{localStorage.setItem('kesef-extat',new Date().toISOString());}catch(e){}});
  }).catch(function(){});
}
function shareEncrypted(){var c=lockCfg();if(!c||!c.bkey){toast(L('קודם צור חשבון'));return;}encryptState(c).then(function(txt){download('kesef-backup-'+todayISO()+'.kesef',txt);});}

function accVal(n){var e=document.querySelector('[data-acc="'+n+'"]');return e?e.value:'';}
function accSignup(){
  var name=accVal('name').trim(),pw=accVal('pw'),pw2=accVal('pw2');ui.accName=name;ui.lockErr='';
  if(!name){ui.lockErr='כתוב את השם שלך';render();return;}
  if(pw.length<8){ui.lockErr='הסיסמה צריכה להיות לפחות 8 תווים';render();return;}
  if(/^(.)\1+$/.test(pw)||/^(12345678|123456789|87654321|password|qwertyui|11111111)$/i.test(pw)){ui.lockErr='סיסמה קלה מדי לניחוש — בחר אחרת';render();return;}
  if(pw!==pw2){ui.lockErr='הסיסמאות לא תואמות';render();return;}
  setAccount(name,pw,null).then(function(){needAccount=false;locked=false;ui.accName='';toast(L('החשבון נוצר — ברוך הבא, ')+name);askBioAfter();render();setTimeout(extBackup,2000);});
}
function setAccount(name,pw,saltHex){var old=lockCfg()||{},salt=saltHex||hx(crypto.getRandomValues(new Uint8Array(16)));
  return derive(pw,salt,ACC_ITER).then(function(d){lockSave({v:2,name:name,salt:salt,iter:ACC_ITER,ver:d.ver,bkey:d.key,bio:old.bio!=null?old.bio:false,after:old.after||0,created:old.created||todayISO()});});}
function askBioAfter(){var B=bioPlugin();if(!B)return;B.isAvailable().then(function(r){if(r&&r.isAvailable){ui.offerBio=true;render();}}).catch(function(){});}
function accLogin(){
  var c=lockCfg(),pw=accVal('pw');if(!c||lockUntil>Date.now())return;if(!pw){ui.lockErr='הקלד סיסמה';render();return;}
  derive(pw,c.salt,c.iter||ACC_ITER).then(function(d){
    if(d.ver===c.ver){if(!c.bkey){c.bkey=d.key;lockSave(c);}unlock();return;}
    lockTries++;ui.lockErr='סיסמה שגויה';if(lockTries>=5){lockUntil=Date.now()+30000*Math.pow(2,Math.min(4,lockTries-5));setTimeout(render,1000);}
    render();if(navigator.vibrate)try{navigator.vibrate(120);}catch(e){}
  });
}
function lockKey(k){ /* legacy numeric code */
  var c=lockCfg();if(!c||!c.legacy||lockUntil>Date.now())return;if(lockInput.length>=c.len)return;lockInput+=k;ui.lockErr='';
  if(lockInput.length<c.len){render();return;}
  crypto.subtle.digest('SHA-256',new TextEncoder().encode(c.salt+lockInput)).then(function(b){
    if(hx(b)===c.hash){needAccount=true;locked=true;ui.accName=c.name||'';ui.lockErr='';lockInput='';toast(L('עכשיו בחר סיסמה של 8 תווים לפחות'));lockSave(null);render();return;}
    lockTries++;lockInput='';ui.lockErr='שגוי';if(lockTries>=5){lockUntil=Date.now()+30000;setTimeout(render,1000);}render();
  });
}
function accRestore(){
  var f=document.querySelector('[data-accfile]'),pw=accVal('pw');ui.lockErr='';
  if(!f||!f.files||!f.files[0]){ui.lockErr='בחר קובץ גיבוי';render();return;}
  if(!pw){ui.lockErr='הקלד את הסיסמה של הגיבוי';render();return;}
  var rd=new FileReader();rd.onload=function(){
    var txt=String(rd.result||'');
    Promise.resolve().then(function(){return decryptBackup(txt,pw);}).then(function(r){
      state=Object.assign(emptyState(),r.state);dedupeCards();
      lockSave({v:2,name:r.name||'',salt:r.salt,iter:r.iter,ver:r.d.ver,bkey:r.d.key,bio:false,after:0,created:todayISO()});
      needAccount=false;locked=false;ui.accRestore=false;save(L('הנתונים שוחזרו — ברוך שובך'));
    }).catch(function(){ui.lockErr='לא הצלחתי לפתוח — סיסמה שגויה או קובץ לא תקין';render();});
  };rd.readAsText(f.files[0]);
}

function penRow(ym){var m=(pen().months||{})[ym]||{},r=penRates(),g=Number(m.gross)||0,base=Math.min(g,PEN_AVG_WAGE);
  var exp=r2(base*(r.emp+r.er+r.sev)/100),erExp=r2(base*(r.er+r.sev)/100),paid=Number(m.paid)||0,has=m.paid!=null&&m.paid!=='';

  return {rows:rows,miss:r2(sum(filled,function(x){return x.miss;})),exp:r2(sum(filled,function(x){return x.exp;})),paid:r2(sum(filled,function(x){return x.paid;})),missMonths:filled.filter(function(x){return x.miss>1;}).length,dedMissing:filled.filter(function(x){return x.ded&&x.miss>1;}).length,todo:rows.filter(function(x){return !x.gross||!x.has;}).length};}

function i18nDom(root){
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),n,list=[];
  while((n=w.nextNode()))list.push(n);
  list.forEach(function(n){var v=n.nodeValue,t=v.trim();if(!t||!/[\u0590-\u05FF]/.test(t))return;var tr=I18N[t];if(tr&&tr[LANG]!=null)n.nodeValue=v.replace(t,tr[LANG]);});

         ru:{upd:'Готова новая версия программы 🎉',now:'Обновить',later:'Позже',apk:'Доступно обновление приложения',dl:'Скачать',off:'Нет интернета — всё работает, данные сохраняются на устройстве'}}[lang]||null;
  T=T||{};
  /* safety copies of the data: once a day and before every update (last 5 kept on the device) */
  function backup(reason){try{var cur=localStorage.getItem('kesef-state-v1');if(!cur)return;var arr=JSON.parse(localStorage.getItem('kesef-backups')||'[]');
    arr.push({at:new Date().toISOString(),reason:reason,v:APPV,data:cur});while(arr.length>5)arr.shift();localStorage.setItem('kesef-backups',JSON.stringify(arr));}catch(e){}}
  try{var d=new Date().toISOString().slice(0,10);if(localStorage.getItem('kesef-backup-day')!==d){backup('daily');localStorage.setItem('kesef-backup-day',d);}}catch(e){}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  function bar(text,btn,onBtn){
    var old=document.getElementById('upd-bar');if(old)old.remove();
    var b=document.createElement('div');b.id='upd-bar';
    b.style.cssText='position:fixed;left:12px;right:12px;bottom:14px;z-index:9999;background:#ffd400;color:#111;border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;font:700 15px system-ui,Arial;box-shadow:0 12px 30px rgba(0,0,0,.5);direction:'+(lang==='he'?'rtl':'ltr');
    var sp=document.createElement('span');sp.textContent=text;b.appendChild(sp);
    var w=document.createElement('span');w.style.cssText='display:flex;gap:8px';
    if(btn){var a=document.createElement('button');a.textContent=btn;a.style.cssText='background:#111;color:#ffd400;border:0;border-radius:10px;padding:8px 14px;font:800 14px system-ui,Arial;cursor:pointer';a.onclick=onBtn;w.appendChild(a);}
    var c=document.createElement('button');c.textContent=T.later||'×';c.style.cssText='background:transparent;color:#111;border:1px solid #111;border-radius:10px;padding:8px 12px;font:700 13px system-ui,Arial;cursor:pointer';c.onclick=function(){b.remove();};w.appendChild(c);
    b.appendChild(w);document.body.appendChild(b);
  }
  var isNative=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
  if(isNative){
    document.documentElement.classList.add('native');
    var SB=window.Capacitor.Plugins&&window.Capacitor.Plugins.StatusBar;
    if(SB){try{SB.setOverlaysWebView({overlay:false});SB.setBackgroundColor({color:'#111111'});SB.setStyle({style:'DARK'});}catch(e){}}
    /* if the page is still drawn under the status bar, push the top bar down by the bar's height */
    setTimeout(function(){try{
      var probe=document.createElement('div');probe.style.cssText='position:fixed;top:0;height:env(safe-area-inset-top,0px);visibility:hidden';document.body.appendChild(probe);
      var envTop=probe.getBoundingClientRect().height;probe.remove();
      var sat=envTop>0?0:(window.innerHeight>=screen.height-4?36:0);
      if(sat)document.documentElement.style.setProperty('--sat',sat+'px');
      var probe2=document.createElement('div');probe2.style.cssText='position:fixed;bottom:0;height:env(safe-area-inset-bottom,0px);visibility:hidden';document.body.appendChild(probe2);var envB=probe2.getBoundingClientRect().height;probe2.remove();
      if(!envB&&window.innerHeight>=screen.height-4)document.documentElement.style.setProperty('--sab','28px');
    }catch(e){}},400);
  }
  if(!isNative&&'serviceWorker' in navigator&&window.isSecureContext){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('sw.js').then(function(reg){
        function ask(w){bar(T.upd,T.now,function(){backup('update');w.postMessage('skip');});}
        if(reg.waiting&&navigator.serviceWorker.controller)ask(reg.waiting);
        reg.addEventListener('updatefound',function(){var nw=reg.installing;if(!nw)return;nw.addEventListener('statechange',function(){if(nw.state==='installed'&&navigator.serviceWorker.controller)ask(nw);});});
        setInterval(function(){reg.update().catch(function(){});},3*3600*1000);
      }).catch(function(){});
      var reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',function(){if(reloaded)return;reloaded=true;location.reload();});
    });
  }
  /* installed Android app (APK): compare with the latest published version */
  if(isNative&&typeof fetch==='function'){
    fetch(PAGES+'version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
      if(!j||!j.v||j.v<=APPV)return;var note=j['note_'+lang]||'';
      bar(T.apk+(note?' — '+note:''),T.dl,function(){backup('update');window.open('https://github.com/'+REPO+'/releases/latest','_blank');});
    }).catch(function(){});
  }
  window.addEventListener('offline',function(){bar(T.off);setTimeout(function(){var b=document.getElementById('upd-bar');if(b&&b.textContent.indexOf(T.off)===0)b.remove();},5000);});
})();
</script>
