<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הכסף שלי</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=Rubik:wght@400;500;700;800;900&display=swap">
<style id="app-style">
:root{--bg:#0b0b0b;--card:#151515;--card2:#1b1b1b;--ink:#f5f5f4;--ink2:#cfcfcf;--muted:#8b8b8b;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.05);
--brand:#ffd400;--brand2:#ffb800;--gold:#ffd400;--blue:#ffd400;--green:#34d399;--red:#f87171;--amber:#fbbf24;
--soft-green:rgba(52,211,153,.12);--soft-red:rgba(248,113,113,.12);--soft-amber:rgba(251,191,36,.12);--soft-blue:rgba(255,212,0,.1);
--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 20px 40px -24px rgba(0,0,0,.8);--r:20px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:dark}
body{margin:0;color:var(--ink);font-family:Heebo,Rubik,system-ui,-apple-system,Arial,sans-serif;font-size:15.5px;line-height:1.65;-webkit-font-smoothing:antialiased;
 background:radial-gradient(900px 520px at 75% -8%,rgba(255,212,0,.09),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(255,212,0,.04),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
.num,.stat .val,td{font-variant-numeric:tabular-nums}
.num{unicode-bidi:isolate;direction:ltr;display:inline-block}
::selection{background:rgba(255,212,0,.35)}
/* layout */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:rgba(10,10,10,.75);backdrop-filter:blur(14px);border-inline-end:1px solid var(--line);padding:24px 14px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 26px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--brand);display:grid;place-items:center;color:#111;box-shadow:0 8px 24px -8px rgba(255,212,0,.6)}
.logo svg{width:22px;height:22px}
.brand b{font-size:19px;font-weight:900;letter-spacing:-.3px;display:block;line-height:1.1;color:#fff}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;font:inherit;font-size:15px;font-weight:500;color:#a3a3a3;padding:11px 13px;border-radius:12px;cursor:pointer;text-align:start;transition:background .15s,color .15s}
.nav button svg{width:19px;height:19px;flex:none}
.nav button:hover{background:rgba(255,255,255,.04);color:#fff}
.nav button.on{background:rgba(255,212,0,.1);color:var(--brand);font-weight:700}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line)}
.main{min-width:0;padding:34px 40px 110px;max-width:1260px;width:100%}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:28px}
.topbar p{order:-1;margin:0 0 6px;color:var(--brand);font-size:12.5px;font-weight:700;letter-spacing:2px}
.topbar>div{display:flex;flex-direction:column}
.topbar h1{font-size:40px;margin:0;font-weight:900;letter-spacing:-1px;line-height:1.1;color:#fff}
.status{font-size:12px;color:var(--muted);background:rgba(255,255,255,.03);border:1px solid var(--line);padding:5px 12px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:#666}
.status.ok{color:var(--green)} .status.ok::before{background:var(--green);box-shadow:0 0 8px var(--green)}
.status.err{color:var(--red)} .status.err::before{background:var(--red)}
/* blocks */
section{margin-bottom:22px}
h2{font-size:19px;margin:0 0 16px;font-weight:800;letter-spacing:-.3px;color:#fff}
h3{font-size:15px;margin:0 0 10px;font-weight:700;color:#fff}
.card,.person{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow);position:relative}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.card.stat{padding:20px 22px;overflow:hidden;transition:border-color .2s,transform .2s}
.card.stat:hover{border-color:rgba(255,212,0,.25);transform:translateY(-1px)}
.card.stat::after{content:"";position:absolute;inset-inline-start:0;top:18px;bottom:18px;width:3px;border-radius:3px;background:linear-gradient(var(--brand),rgba(255,212,0,0))}
.stat .lbl{font-size:13px;color:var(--muted);font-weight:500}
.stat .val{font-size:28px;font-weight:800;margin-top:6px;letter-spacing:-.6px;line-height:1.15;color:#fff}
.stat .sub{font-size:12.5px;color:var(--muted);margin-top:7px}
.pos{color:var(--green)!important} .neg{color:var(--red)!important} .warn{color:var(--amber)!important}
/* hero */
.hero{border-radius:26px;padding:30px 32px;color:#fff;background:radial-gradient(600px 300px at 90% 0%,rgba(255,212,0,.16),transparent 60%),linear-gradient(160deg,#1a1a1a,#0f0f0f);border:1px solid rgba(255,212,0,.18);box-shadow:0 30px 60px -30px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.02) inset;position:relative;overflow:hidden}
.hero .k{font-size:12.5px;color:var(--brand);font-weight:700;letter-spacing:1.5px}
.hero .big{font-size:58px;font-weight:900;letter-spacing:-2px;line-height:1.05;margin:8px 0 10px;color:#fff}
.hero .mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:24px;position:relative;z-index:1}
.hero .mini div{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:13px 15px}
.hero .mini span{display:block;font-size:12.5px;color:var(--muted)}
.hero .mini b{font-size:20px;font-weight:800}
.hero .pill{display:inline-block;font-size:12px;font-weight:700;background:rgba(52,211,153,.14);color:var(--green);padding:4px 12px;border-radius:999px}
/* forms */
form.f{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end}
label{display:flex;flex-direction:column;gap:7px;font-size:13px;color:#bdbdbd;font-weight:600}
input,select{font:inherit;font-size:15px;color:#fff;padding:11px 13px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(255,255,255,.04);width:100%;transition:border-color .15s,box-shadow .15s,background .15s}
select option{background:#1b1b1b;color:#fff}
input:hover,select:hover{border-color:rgba(255,255,255,.18)}
input:focus,select:focus{outline:none;background:rgba(255,255,255,.06);border-color:var(--brand);box-shadow:0 0 0 4px rgba(255,212,0,.14)}
input::placeholder{color:#6b6b6b}
input[type=range]{accent-color:var(--brand)}
button.b{font:inherit;font-weight:800;font-size:15px;border:0;border-radius:999px;padding:12px 22px;cursor:pointer;background:var(--brand);color:#111;white-space:nowrap;box-shadow:0 10px 30px -10px rgba(255,212,0,.65);transition:transform .1s,filter .15s,box-shadow .2s}
button.b:hover{filter:brightness(1.05);box-shadow:0 12px 34px -8px rgba(255,212,0,.8)}
button.b:active{transform:translateY(1px)}
button.b[style*="--green"]{background:var(--green)!important;color:#05170f!important;box-shadow:0 10px 30px -12px rgba(52,211,153,.6)!important}
button.s{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:999px;padding:6px 14px;cursor:pointer;color:#d4d4d4;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
button.s:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16);color:#fff}
button.s.danger{color:#fca5a5} button.s.danger:hover{background:var(--soft-red);border-color:rgba(248,113,113,.3)}
button.s.confirm{background:var(--red);color:#1a0505;border-color:var(--red)}
button.s.go{color:var(--green)} button.s.go:hover{background:var(--soft-green);border-color:rgba(52,211,153,.3)}
button.s.sel{background:var(--brand)!important;color:#111!important;border-color:var(--brand)!important}
/* tables */
table{width:100%;border-collapse:collapse}
th{text-align:start;font-size:12px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:14px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s} tbody tr:hover{background:rgba(255,255,255,.02)}
.tablewrap{overflow-x:auto;margin:0 -6px;padding:0 6px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.b-in{background:var(--soft-green);color:var(--green)} .b-out{background:var(--soft-red);color:var(--red)}
.b-done{background:rgba(255,255,255,.06);color:#a3a3a3} .b-late{background:rgba(255,212,0,.1);color:var(--brand)}
.muted{color:var(--muted)} .small{font-size:13px}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
.bar{height:8px;background:rgba(255,255,255,.07);border-radius:999px;overflow:hidden;min-width:90px}
.bar>i{display:block;height:100%;border-radius:999px;transition:width .5s}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.legend{display:grid;gap:10px;flex:1;min-width:180px}
.legend div{display:flex;align-items:center;gap:9px;font-size:14px}
.legend div .muted{margin-inline-start:auto}
.dot{width:10px;height:10px;border-radius:4px;flex:none}
.donut-wrap{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.months{display:flex;align-items:flex-end;gap:14px;height:190px;padding-top:10px}
.months .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.months .bars{display:flex;gap:5px;align-items:flex-end;height:150px}
.months .bars i{width:15px;border-radius:6px 6px 2px 2px;display:block}
/* tips */
.tip{border-radius:16px;padding:16px 18px;border:1px solid var(--line);background:rgba(255,255,255,.025);display:flex;gap:14px;align-items:flex-start;border-inline-start:3px solid var(--brand)}
.tip .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;background:rgba(255,212,0,.1);color:var(--brand)}
.tip .ic svg{width:17px;height:17px}
.tip b{display:block;margin-bottom:3px;font-size:15px;color:#fff}
.tip span{color:#bdbdbd;font-size:14.5px}
.tip.bad{border-inline-start-color:var(--red)} .tip.bad .ic{background:var(--soft-red);color:var(--red)}
.tip.warn{border-inline-start-color:var(--amber)} .tip.warn .ic{background:var(--soft-amber);color:var(--amber)}
.tip.good{border-inline-start-color:var(--green)} .tip.good .ic{background:var(--soft-green);color:var(--green)}
.person{padding:18px 20px}
.person .nm{font-weight:700;font-size:16px;color:#fff}
.repay{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.repay input{width:96px;padding:6px 10px;font-size:14px}
.monthnav{display:flex;gap:8px;align-items:center}
.monthnav input{width:auto}
/* credit card visual */
.cc{width:260px;max-width:100%;aspect-ratio:1.586;border-radius:18px;padding:18px 20px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(200px 140px at 100% 0%,rgba(255,212,0,.25),transparent 70%),linear-gradient(140deg,#262626,#111);border:1px solid rgba(255,255,255,.1);box-shadow:0 24px 40px -20px rgba(0,0,0,.9);position:relative;overflow:hidden;flex:none;transform:perspective(900px) rotateY(-6deg) rotateX(3deg);transition:transform .3s}
.cc:hover{transform:none}
.wcards{display:flex;flex-direction:column;gap:8px}.wcard{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}.wcard.miss{border-color:var(--red)}.wcard .dot{width:14px;height:14px;border-radius:50%;flex:none}.wcard select{width:auto;min-width:0;flex:1 1 140px}
.occcard{transition:transform .15s,border-color .15s}.occcard:hover,.occcard:focus{transform:translateY(-2px);border-color:rgba(255,212,0,.5);outline:none}
.qzopts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.qzopts .wchoice{min-height:64px;text-align:center;justify-content:center}@media(max-width:620px){.qzopts{grid-template-columns:1fr}.qzopts .wchoice{min-height:50px}}
.wf{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.cc .chip{width:36px;height:26px;border-radius:7px;background:linear-gradient(135deg,#ffe066,#c9a400)}
.cc .no{direction:ltr;text-align:end;letter-spacing:3px;font-size:16px;opacity:.95}
.cc .nm{font-weight:800;font-size:15px}
.cc .bd{font-size:11.5px;color:#d4d4d4}
.cc.c1{background:radial-gradient(200px 140px at 100% 0%,rgba(52,211,153,.25),transparent 70%),linear-gradient(140deg,#1f2a25,#0e1110)}
.cc.c2{background:radial-gradient(200px 140px at 100% 0%,rgba(96,165,250,.25),transparent 70%),linear-gradient(140deg,#1d2430,#0d1015)}
.cc.c3{background:radial-gradient(200px 140px at 100% 0%,rgba(248,113,113,.25),transparent 70%),linear-gradient(140deg,#2a1d1d,#110d0d)}
footer{margin-top:44px;border-top:1px solid var(--line);padding-top:22px}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,10px);background:#1f1f1f;color:#fff;border:1px solid rgba(255,212,0,.3);padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;z-index:30;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:0 12px 30px -10px rgba(0,0,0,.8)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.notice{background:var(--soft-amber);border:1px solid rgba(251,191,36,.3);border-radius:14px;padding:11px 15px;margin-bottom:18px;font-size:14px}
/* reports (ledger) */
.rep{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:20px;padding:28px 30px;margin-bottom:22px;box-shadow:var(--shadow)}
.rep-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;border-bottom:1px solid rgba(255,212,0,.35);padding-bottom:12px;margin-bottom:6px}
.rep-title{font-size:22px;font-weight:900;margin:0;color:#fff;letter-spacing:-.4px}
.rep-sub{color:var(--muted);font-size:13px}
.ledger{width:100%;border-collapse:collapse;font-size:14.5px}
.ledger th{font-size:12px;border-bottom:1px solid var(--line);padding:9px 10px}
.ledger th.n,.ledger td.n{text-align:end;white-space:nowrap;width:1%;padding-inline-start:26px}
.ledger td{padding:9px 10px;border-bottom:1px dashed rgba(255,255,255,.07)}
.ledger tr.sec td{font-weight:800;color:var(--brand);background:rgba(255,212,0,.04);border-bottom:1px solid var(--line);padding-top:12px;font-size:12.5px;letter-spacing:1px}
.ledger tr.ind td:first-child{padding-inline-start:24px;color:#d4d4d4}
.ledger tr.sub td{font-weight:700;border-top:1px solid rgba(255,255,255,.25);border-bottom:0}
.ledger tr.tot td{font-weight:900;font-size:16px;border-top:1px solid rgba(255,255,255,.4);border-bottom:3px double rgba(255,212,0,.6);padding-top:11px;color:#fff}
.ledger tbody tr:hover{background:transparent}
.ratio{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:14px}
.ratio>div{border:1px solid var(--line);border-radius:16px;padding:16px 18px;background:rgba(255,255,255,.02);border-inline-start:3px solid #444}
.ratio>div.ok{border-inline-start-color:var(--green)}.ratio>div.mid{border-inline-start-color:var(--amber)}.ratio>div.bad{border-inline-start-color:var(--red)}
.ratio .rn{font-size:13px;color:#bdbdbd;font-weight:600}
.ratio .rv{font-size:28px;font-weight:800;margin:4px 0;font-variant-numeric:tabular-nums;color:#fff}
.ratio .rb{font-size:12.5px;color:var(--muted)}
.ratio .st{float:left;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.st.ok{background:var(--soft-green);color:var(--green)}.st.mid{background:var(--soft-amber);color:var(--amber)}.st.bad{background:var(--soft-red);color:var(--red)}.st.na{background:rgba(255,255,255,.06);color:#a3a3a3}
.notes ol{margin:8px 0 0;padding-inline-start:20px;color:#d4d4d4}.notes li{margin-bottom:10px}.notes b{color:#fff}
.sig{margin-top:18px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-top:10px}
/* health score */
.health{display:grid;grid-template-columns:300px 1fr;gap:34px;align-items:center}
.gauge{text-align:center}
.gauge .score{font-size:56px;font-weight:900;letter-spacing:-2px;line-height:1;color:#fff}
.gauge .of{color:var(--muted);font-size:14px;margin-top:2px}
.gauge .lvl{display:inline-block;margin-top:10px;font-size:13px;font-weight:800;padding:4px 14px;border-radius:999px}
.hrow{margin-bottom:18px}.hrow:last-child{margin-bottom:0}
.hrow .t{display:flex;justify-content:space-between;font-weight:700;font-size:14.5px;margin-bottom:7px;color:#fff}
.hrow .t span:last-child{font-variant-numeric:tabular-nums}
.hrow .bar{height:9px}
.hrow .d{font-size:12.5px;color:var(--muted);margin-top:6px}
.eyebrow{color:var(--brand);font-size:12px;font-weight:800;letter-spacing:2px;margin-bottom:6px}
/* overlays */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);z-index:20;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
body{padding-bottom:env(safe-area-inset-bottom,0px)}
.native .side{padding-top:calc(10px + var(--sat,0px))}
.native .modal-bg{padding-top:calc(16px + var(--sat,0px))}
.modal{background:#161616;border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:26px;width:min(680px,100%);max-height:90vh;max-height:calc(100dvh - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - var(--sat,0px));overflow:auto;overscroll-behavior:contain;box-shadow:0 40px 80px -30px rgba(0,0,0,.9);border-top:2px solid var(--brand)}
.undo{position:fixed;bottom:22px;right:50%;transform:translateX(50%);background:#1c1c1c;color:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 10px 8px 18px;display:flex;gap:14px;align-items:center;z-index:15;box-shadow:0 12px 30px -10px rgba(0,0,0,.8);font-size:14px;max-width:calc(100% - 24px)}
.undo button{font:inherit;font-weight:800;background:var(--brand);border:0;color:#111;border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.fab{position:fixed;bottom:26px;left:26px;z-index:12;display:flex;align-items:center;gap:8px;font:inherit;font-weight:800;font-size:15px;background:var(--brand);color:#111;border:0;border-radius:999px;padding:14px 22px 14px 20px;cursor:pointer;box-shadow:0 14px 34px -10px rgba(255,212,0,.7)}
.fab svg{width:18px;height:18px}.fab:hover{filter:brightness(1.05)}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .g2{grid-template-columns:minmax(0,1fr)}
  .g3{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  form.f{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .donut-wrap{justify-content:center}
  .monthnav{width:100%;flex-wrap:wrap}.monthnav input{flex:1;min-width:0}.monthnav button{flex:none}
  .side{position:sticky;top:0;z-index:5;height:auto;flex-direction:row;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) 10px calc(12px + env(safe-area-inset-left,0px));border-inline-end:0;border-bottom:1px solid var(--line);gap:10px;background:rgba(10,10,10,.85)}
  .brand{padding:0}.brand div{display:none}.logo{width:36px;height:36px}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
  .nav::-webkit-scrollbar{display:none}
  .nav button{padding:8px 12px;font-size:14px;white-space:nowrap;gap:7px}
  .nav button svg{width:16px;height:16px}
  .side-foot{display:none}
  .main{padding:22px 14px 110px}
  .topbar h1{font-size:30px}
  .stat .val{font-size:23px}.hero .big{font-size:42px}.hero{padding:22px;border-radius:22px}

 special notes.<\/p>", "ru": "<p class=\"muted\">Особых замечаний нет.<\/p>"}, "<p class=\"muted\">ניתוח עם Claude זמין רק כשהתוכנה פתוחה כאן ב-Claude. הניתוח האוטומטי למטה עובד גם בלעדיו.<\/p>": {"en": "<p class=\"muted\">Claude analysis is only available when the app is open here in Claude. The automatic analysis below works without it too.<\/p>", "ru": "<p class=\"muted\">Анализ с Claude доступен, только когда приложение открыто здесь, в Claude. Автоматический анализ ниже работает и без него.<\/p>"}, "<p class=\"muted\">עוד לא רשמת יתרה. כתוב כמה יש לך עכשיו בחשבון (במינוס — עם סימן מינוס, למשל ‎-500).<\/p>": {"en": "<p class=\"muted\">You haven't entered a balance yet. Enter how much you have in your account now (if overdrawn — with a minus sign, e.g. ‎-500).<\/p>", "ru": "<p class=\"muted\">Вы ещё не указали баланс. Введите, сколько сейчас на счёте (при овердрафте — со знаком минус, например ‎-500).<\/p>"}, "<p class=\"small muted\" style=\"margin-bottom:0\">איך זה מחושב: כל קנייה באשראי בחודש מסוים יורדת במועד החיוב של החודש שאחריו (קנייה ב-15/11 בכרטיס עם חיוב ב-10 לחודש → יורדת ב-10/12). תשלומים קבועים ועסקאות בתשלומים שמשויכים לכרטיס יורדים ביום החיוב של אותו חודש. יום אחרי החיוב — הסכום יורד אוטומטית מהיתרה בבנק, והכרטיס עובר לחיוב הבא.<\/p><\/section>": {"en": "<p class=\"small muted\" style=\"margin-bottom:0\">How it's calculated: every credit card purchase in a given month is charged on the billing day of the following month (a purchase on 15/11 with a card billed on the 10th → charged on 10/12). Fixed payments and installment purchases linked to the card are charged on that month's billing day. The day after billing, the amount is automatically deducted from the bank balance, and the card moves on to the next charge.<\/p><\/section>", "ru": "<p class=\"small muted\" style=\"margin-bottom:0\">Как это считается: каждая покупка по кредитной карте в определённом месяце списывается в день списания следующего месяца (покупка 15/11 по карте со списанием 10-го числа → списывается 10/12). Постоянные платежи и покупки в рассрочку, привязанные к карте, списываются в день списания того же месяца. На следующий день после списания сумма автоматически вычитается из баланса в банке, а карта переходит к следующему списанию.<\/p><\/section>"}, "<p class=\"small muted\" style=\"margin-bottom:0\">יום אחרי מועד החיוב של כרטיס, סכום החיוב יורד מהיתרה כאן אוטומטית. אם תעדכן יתרה ידנית — החיובים שלפני העדכון כבר נחשבים כלולים בה.<\/p>": {"en": "<p class=\"small muted\" style=\"margin-bottom:0\">The day after a card's billing day, the charge amount is automatically deducted from the balance here. If you update the balance manually, charges made before the update are considered already included in it.<\/p>", "ru": "<p class=\"small muted\" style=\"margin-bottom:0\">На следующий день после дня списания по карте сумма списания автоматически вычитается из баланса здесь. Если вы обновите баланс вручную, списания до обновления считаются уже учтёнными в нём.<\/p>"}, "<p class=\"small muted\" style=\"margin-bottom:0\">קבע סכום חודשי כדי לראות מתי תסיים, ושהתשלום ייכלל בצפי היתרה בבנק. למשל: ": {"en": "<p class=\"small muted\" style=\"margin-bottom:0\">Set a monthly amount to see when you'll finish and to include the payment in the bank balance forecast. For example: ", "ru": "<p class=\"small muted\" style=\"margin-bottom:0\">Укажите ежемесячную сумму, чтобы увидеть, когда вы закончите, и чтобы платёж учитывался в прогнозе баланса в банке. Например: "}, "<p class=\"small muted\" style=\"margin-bottom:0\">רוצה לסמן הוצאה באשראי? הוסף כרטיס בלשונית \"כרטיסי אשראי\".<\/p>": {"en": "<p class=\"small muted\" style=\"margin-bottom:0\">Want to mark an expense as paid by credit card? Add a card in the \"Credit cards\" tab.<\/p>", "ru": "<p class=\"small muted\" style=\"margin-bottom:0\">Хотите отметить расход по кредитной карте? Добавьте карту во вкладке \"Кредитные карты\".<\/p>"}, "<p class=\"small muted\" style=\"margin-bottom:0\">רעיון לפתיחה: קרן ח ожидаемых расходов и платежей останется примерно "}, "אחרי שבוע של רישום הוצאות תופיע גם הערכה של הוצאות יומיומיות.": {"en": "After a week of logging expenses, an estimate of daily spending will also appear.", "ru": "После недели записи расходов появится и оценка ежедневных трат."}, "אין חיובים קרובים": {"en": "No upcoming charges", "ru": "Нет ближайших списаний"}, "אין כרית ביטחון של חודש": {"en": "No one-month safety cushion", "ru": "Нет финансовой подушки на месяц"}, "אין מספיק בחיסכון — נחסכו ": {"en": "Not enough in savings — saved ", "ru": "Накоплений недостаточно — отложено "}, "אין נתונים": {"en": "No data", "ru": "Нет данных"}, "אין עדיין חודש שלם של נתונים — חלק מהחישובים מבוססים על הערכה.": {"en": "There isn't a full month of data yet — some calculations are estimates.", "ru": "Пока нет данных за полный месяц — часть расчётов основана на оценке."}, "אין עדיין יעד חיסכון": {"en": "No savings goal yet", "ru": "Пока нет цели накоплений"}, "אין עדיין נתונים": {"en": "No data yet", "ru": "Пока нет данных"}, "אין תוכנית": {"en": "No plan", "ru": "Нет плана"}, "אין תוכנית החזר להלוואה מ": {"en": "No repayment plan for the loan from ", "ru": "Нет плана погашения займа от "}, "אם אתה נוסע ברכב שלך לעבודה — בדוק שאתה מקבל החזר נסיעות על כל נסיעה, ושמור קבלות. השווה מחירי סולר בין תחנות ואפליקציות הנחה.": {"en": "If you drive your own car to work — make sure you get travel reimbursement for every trip, and keep receipts. Compare diesel prices across gas stations and discount apps.", "ru": "Если вы ездите на работу на своей машине — убедитесь, что получаете возмещение транспортных расходов за каждую поездку, и сохраняйте чеки. Сравнивайте цены на дизель на разных заправках и в приложениях со скидками."}, "אם יש עסקה עם ריבית (\"קרדיט\") — בדוק אם משתלם לסגור אותה מוקדם.": {"en": "If there's an interest-bearing transaction (\"revolving credit\") — check whether it pays to close it early.", "ru": "Если есть сделка с процентами (\"кредит\" по карте) — проверьте, выгодно ли закрыть её досрочно."}, "אמצעי תשלום": {"en": "Payment method", "ru": "Способ оплаты"}, "אני חייב": {"en": "I owe", "ru": "Я должен"}, "אני חייב לו": {"en": "I owe them", "ru": "Я ему должен"}, "אני חייב למישהו": {"en": "I owe someone", "ru": "Я должен кому-то"}, "אפליקציה/כרטיס הנחה בדלק": {"en": "Fuel discount app/card", "ru": "Приложение/карта скидок на топливо"}, "אפשר להוציא עד <b style=\"color:#ffd400;font-size:17px\">": {"en": "You can spend up to <b style=\"color:#ffd400;font-size:17px\">", "ru": "Можно потратить до <b style=\"color:#ffd400;font-size:17px\">"}, "אפשר לקזז חוב": {"en": "You can offset a debt", "ru": "Можно зачесть долг"}, "אשראי": {"en": "Credit card", "ru": "Кредитная карта"}, "אתה כבר מתדלק בזול": {"en": "You're already fueling up cheaply", "ru": "Вы уже заправляетесь дёшево"}, "אתה משלם ": {"en": "You pay ", "ru": "Вы платите "}, "ב": {"en": "in ", "ru": "в "}, "ב-": {"en": "on ", "ru": "в "}, "בדוק את ההפקדות באתר \"הר הכסף\", ושמור תלושים. אפשר גם לבדוק החזר מס עד 6 שנים אחורה (טופס 135).": {"en": "Check the deposits on the \"Har HaKesef\" website, and keep your payslips. You can also check for a tax refund up to 6 years back (Form 135).", "ru": "Проверьте отчисления на сайте \"Хар а-Кесеф\" и сохраняйте расчётные листки. Также можно проверить возврат налога за период до 6 лет назад (форма 135)."}, "בדוק בלשונית \"הוצאות\" איזו קטגוריה קפצה — ושם תקציב לקטגוריה הזאת.": {"en": "Check in the \"Expenses\" tab which category jumped — and set a budget for that category.", "ru": "Проверьте во вкладке \"Расходы\", какая категория выросла, — и задайте для неё бюджет."}, "בדוק בפירוט האשראי. אם זה כפול — פנה לבית העסק או לחברת האשראי.": {"en": "Check your credit card statement. If it's a duplicate — contact the merchant or the card company.", "ru": "Проверьте выписку по кредитной карте. Если это дубль — обратитесь в магазин или в компанию кредитной карты."}, "בדוק מנויים": {"en": "Review subscriptions", "ru": "Проверьте подписки"}, "בדוק שאין ".": {"en": "Without income, it's impossible to calculate how much you have left. Record this month's income in the \"Expenses & income\" tab.", "ru": "Без дохода невозможно рассчитать, сколько у вас остаётся. Запишите доходы за месяц во вкладке \"Расходы и доходы\"."}, "בלי יתרה המוח לא יכול לחזות מינוס, תקציב יומי וכרית ביטחון.": {"en": "Without a balance, the brain can't predict overdraft, a daily budget or a safety cushion.", "ru": "Без баланса мозг не может прогнозировать овердрафт, дневной бюджет и финансовую подушку."}, "בלי מסגרת אי אפשר לחשב ניצול ולהתריע לפני שנגמרת.": {"en": "Without a credit limit, usage can't be calculated and you can't be alerted before it runs out.", "ru": "Без лимита невозможно рассчитать использование и предупредить, пока он не исчерпан."}, "בלשונית \"סקירה\" אפשר לרשום כמה יש לך בבנק — ואז תראה כמה יישאר אחרי חיובי האשראי והתשלומים הקרובים.": {"en": "In the \"Overview\" tab you can record how much you have in the bank — then you'll see how much will remain after credit card charges and upcoming payments.", "ru": "Во вкладке \"Обзор\" можно указать, сколько у вас в банке, — и тогда вы увидите, сколько останется после списаний по кредитным картам и ближайших платежей."}, "בנה כרית של לפחות חודש הוצאות אחד, ותזמן את החיובים הקבועים לימים שאחרי שההכנסה נכנסת.": {"en": "Build a cushion of at least one month of expenses, and schedule fixed charges for the days right after your income arrives.", "ru": "Создайте подушку минимум на один месяц расходов и назначьте постоянные списания на дни после поступления дохода."}, "בנזין": {"en": "Gasoline", "ru": "Бензин"}, "בנזין 95": {"en": "Gasoline 95", "ru": "Бензин 95"}, "בנזין 95 (הדלק שלך)": {"en": "Gasoline 95 (your fuel)", "ru": "Бензин 95 (ваше топливо)"}, "בנק": {"en": "Bank", "ru": "Банк"}, "בסיכון": {"en": "At risk", "ru": "Под угрозой"}, "בקצב הנוכחי החודש ייגמר בגירעון": {"en": "At the current pace, the month will end in a deficit", "ru": "При текущем темпе месяц закончится в дефиците"} nd\">", "ru": " раз<\/div><\/td><td style=\"text-align:end\">"}, "\"הר הכסף\" ו\"הר הביטוח\" באתר משרד האוצר.": {"en": "the Finance Ministry's \"Har HaKesef\" and \"Har HaBituach\" sites.", "ru": "сайты Минфина «Хар а-Кесеф» и «Хар а-Битуах»."}, "(הכנסה − הוצאה) ÷ הכנסה": {"en": "(income − expenses) ÷ income", "ru": "(доход − расходы) ÷ доход"}, "0–10,000; מעל 2,500 = ריכוזי": {"en": "0–10,000; above 2,500 = concentrated", "ru": "0–10 000; выше 2 500 = концентрированно"}, "<tr><td>חלק ההוצאות באשראי החודש<\/td><td style=\"text-align:end\">": {"en": "<tr><td>Share of spending on credit this month<\/td><td style=\"text-align:end\">", "ru": "<tr><td>Доля расходов по кредитке в этом месяце<\/td><td style=\"text-align:end\">"}, "<tr><td>חלק ההוצאות בסופ״ש<\/td><td style=\"text-align:end\">": {"en": "<tr><td>Share of spending on weekends<\/td><td style=\"text-align:end\">", "ru": "<tr><td>Доля расходов в выходные<\/td><td style=\"text-align:end\">"}, "<tr><td>מנויים קבועים בשנה<\/td><td style=\"text-align:end\">": {"en": "<tr><td>Recurring subscriptions per year<\/td><td style=\"text-align:end\">", "ru": "<tr><td>Постоянные подписки за год<\/td><td style=\"text-align:end\">"}, "<tr><td>קניות קטנות (עד 50 ₪) החודש<\/td><td style=\"text-align:end\">": {"en": "<tr><td>Small purchases (up to 50 ₪) this month<\/td><td style=\"text-align:end\">", "ru": "<tr><td>Мелкие покупки (до 50 ₪) в этом месяце<\/td><td style=\"text-align:end\">"}, "אוכל בעבודה": {"en": "Food at work", "ru": "Еда на работе"}, "אח/ות / מטפל/ת / עובד/ת בריאות": {"en": "Nurse / caregiver / healthcare worker", "ru": "Медсестра / сиделка / медработник"}, "איך נוח לך שהתוכנה תדבר איתך?": {"en": "How would you like the app to talk to you?", "ru": "Как вам удобнее, чтобы приложение общалось с вами?"}, "אין לי רכב": {"en": "I don't have a car", "ru": "У меня нет машины"}, "אם המעסיק מציע קרן השתלמות — זה אחד החסכונות המשתלמים ביותר מבחינת מס.": {"en": "If your employer offers a study fund (keren hishtalmut), it is one of the most tax-efficient ways to save.", "ru": "Если работодатель предлагает фонд повышения квалификации (керен иштальмут) — это один из самых выгодных по налогам способов накопления."}, "אם יש ארוחה במשמרת — הורד את תקציב המסעדות בהתאם.": {"en": "If you get a meal on shift, lower your restaurant budget accordingly.", "ru": "Если на смене есть питание — соответственно уменьшите бюджет на рестораны."}, "אפשר להוציא היום עד ": {"en": "You can spend today up to ", "ru": "Сегодня можно потратить до "}, "אפשר לשנות הכל בכל רגע — בכפתור \"הפרופיל שלי\".": {"en": "You can change everything at any time with the \"My profile\" button.", "ru": "Всё можно изменить в любой момент — кнопкой «Мой профиль»."}, "אצל ההורים / אחר": {"en": "With parents / other", "ru": "У родителей / другое"}, "ארוחות במשמרת חוסכות כסף אמיתי על אוכל.": {"en": "Meals on shift save real money on food.", "ru": "Питание на смене даёт реальную экономию на еде."}, "אתה לומד כרגע?": {"en": "Are you currently studying?", "ru": "Вы сейчас учитесь?"}, "בבנייה ובשיפוצים יש ימים בלי עבודה (חגים, גשם).": {"en": "In construction and renovation there are days without work (holidays, rain).", "ru": "В строительстве и ремонте бывают дни без работы (праздники, дождь)."}, "בדוק את דמי הניהול בקרן הפנסיה ואם יש כפל ביטוחים.": {"en": "Check your pension fund management fees and whether you have duplicate insurance.", "ru": "Проверьте комиссии за управление в пенсионном фонде и нет ли двойных страховок."}, "בדוק את התעריף בכל תלוש.": {"en": "Check the rate on every payslip.", "ru": "Проверяйте ставку в каждом расчётном листке."}, "בדוק באתר \"הר הכסף\" שההפקדות נכנסות.": {"en": "Check on \"Har HaKesef\" that the deposits are coming in.", "ru": "Проверьте на сайте «Хар а-Кесеф», что отчисления поступают."}, "בדוק בכל תלוש: תעריף שבת, שעות נוספות והפרשה לפנסיה.": {"en": "Check every payslip: Saturday rate, overtime and pension contribution.", "ru": "Проверяйте каждый расчётный листок: ставку за субботу, сверхурочные и отчисления в пенсию."}, "בדוק ברשות המקומית ובאתר \"כל זכות\".": {"en": "Check with your local authority and on \"Kol Zchut\".", "ru": "Уточните в местном муниципалитете и на сайте «Коль Зхут»."}, "בדוק בתלוש אם יש הפרשה לקרן השתלמות, ואם לא — שאל.": {"en": "Check your payslip for a study fund contribution, and if there isn't one — ask.", "ru": "Проверьте в расчётном листке, есть ли отчисления в фонд повышения квалификации, а если нет — спросите."}, "בדוק בתלוש את יתרות החופשה והמחלה. חופשה שלא נוצלה — שווה כסף בסיום העבודה.": {"en": "Check your vacation and sick-day balances on your payslip. Unused vacation is worth money when you leave the job.", "ru": "Проверьте в расчётном листке остатки отпускных и больничных дней. Неиспользованный отпуск оплачивается при увольнении."}, "בדוק בתלוש ובהסכם איך משולמים חודשי החופשה.": {"en": "Check your payslip and contract to see how vacation months are paid.", "ru": "Проверьте в расчётном листке и договоре, как оплачиваются месяцы каникул."}, "בדוק פרופיל סטודנט ברב-קו והנחות במוסד הלימודים.": {"en": "Get a student profile on Rav-Kav and check discounts at your school.", "ru": "Оформите студенческий профиль на «Рав-Кав» и узнайте о скидках в своём учебном заведении."}, "בדוק שההפקדות מתבצעות, ושקול קרן השתלמות לעצמאים.": {"en": "Make sure deposits are being made, and consider a study fund for the self-employed.", "ru": "Убедитесь, что отчисления производятся, и рассмотрите фонд повышения квалификации для самозанятых."}, "בדוק תקרות והנחות בקופה שלך.": {"en": "Check the caps and discounts in your health fund.", "ru": "Проверьте лимиты и скидки в своей больничной кассе."}, "בוקר / שעות רגילות": {"en": "Morning / regular hours", "ru": "Утро / обычные часы"}, "בחודשים חזקים — שים בצד לחודשים החלשים. יעד: כרית של לפחות חודש.": {"en": "In strong months, set money aside for the weak ones. Goal: a cushion of at least one month.", "ru": "В хорошие месяцы откладывайте на слабые. Цель — подушка минимум на месяц."}, "בחינוך קרן השתלמות נפו ловых денег мешает увидеть реальную прибыль."}, "ערבים": {"en": "Evenings", "ru": "Вечера"}, "ערך": {"en": "Value", "ru": "Значение"}, "פיקדון ומענק שחרור": {"en": "Discharge deposit and grant", "ru": "Депозит и пособие при демобилизации"}, "פנסיה": {"en": "Pension", "ru": "Пенсия"}, "פנסיה וביטוחים": {"en": "Pension and insurance", "ru": "Пенсия и страховки"}, "פנסיה חובה לעצמאים": {"en": "Mandatory pension for the self-employed", "ru": "Обязательная пенсия для самозанятых"}, "פנסיה חובה מגיל 21: 6% עובד, 6.5% מעסיק ו-6% פיצויים.": {"en": "Mandatory pension from age 21: 6% employee, 6.5% employer and 6% severance.", "ru": "Обязательная пенсия с 21 года: 6% — работник, 6.5% — работодатель и 6% — компенсация при увольнении."}, "פנסיונר/ית": {"en": "Retired", "ru": "Пенсионер"}, "פרח רוקחות / עוזר רוקח": {"en": "Pharmacy assistant", "ru": "Помощник фармацевта"}, "פשוט": {"en": "Simple", "ru": "Простой"}, "פתח יעד חיסכון \"ציוד\" במקום לקנות בתשלומים.": {"en": "Open an \"Equipment\" savings goal instead of buying in installments.", "ru": "Создайте цель накопления «Оборудование» вместо покупки в рассрочку."}, "פתח יעד חיסכון \"רכב\" והפרש כל חודש סכום קבוע.": {"en": "Open a \"Car\" savings goal and set aside a fixed amount every month.", "ru": "Создайте цель накопления «Машина» и откладывайте фиксированную сумму каждый месяц."}, "פתח יעד חיסכון לכל עונה כזו מראש.": {"en": "Open a savings goal for each such season in advance.", "ru": "Заранее создайте цель накопления для каждого такого сезона."}, "קבועות ÷ הכנסה": {"en": "Fixed ÷ income", "ru": "Постоянные ÷ доход"}, "קבע סכום חודשי קבוע לקניות בהנחת עובד, ורשום אותן בקטגוריה נפרדת כדי לראות כמה זה באמת.": {"en": "Set a fixed monthly amount for employee-discount purchases, and record them in a separate category to see how much it really is.", "ru": "Установите фиксированную месячную сумму на покупки со скидкой для сотрудников и записывайте их в отдельную категорию, чтобы видеть реальную сумму."}, "קבע תקציב קבוע לפינוקים /* merge the page's saved data with this browser's copy, item by item, so neither side is lost */
function mergeStates(a,b){
  a=Object.assign(emptyState(),a||{});b=Object.assign(emptyState(),b||{});
  var newer=(b.updatedAt||0)>(a.updatedAt||0)?b:a,older=newer===a?b:a,out=emptyState(),del={};

/* two cards with the same last 4 digits are the same card: keep the user's own (not one Claude added), move everything onto it */
function dedupeCards(){
  var by={},changed=false;
  state.cards.slice().forEach(function(c){
    var k=String(c.last4||'').trim();if(!k)return;var keep=by[k];if(!keep){by[k]=c;return;}
    var win=(keep.seed&&!c.seed)?c:keep,lose=win===keep?c:keep;by[k]=win;
    state.expenses.forEach(function(e){if(e.card===lose.id)e.card=win.id;});
    state.future.forEach(function(f){if(f.card===lose.id)f.card=win.id;});
    if(!win.limit&&lose.limit)win.limit=lose.limit;
    if(!win.opening&&lose.opening){win.opening=lose.opening;win.openingDate=lose.openingDate;}
    Object.keys(state.settled||{}).forEach(function(key){if(key.indexOf(lose.id+'|')===0)delete state.settled[key];});
    state.cards=state.cards.filter(function(x){return x.id!==lose.id;});
    if(state.deleted.indexOf(lose.id)<0)state.deleted.push(lose.id);
    changed=true;
  });
  return changed;
}

function guessCat(text){var t=' '+String(text||'').toLowerCase()+' ';for(var i=0;i<CAT_KEYS.length;i++){var ks=CAT_KEYS[i][1];for(var j=0;j<ks.length;j++)if(t.indexOf(ks[j].toLowerCase())>=0)return CAT_KEYS[i][0];}return '';}

/* ---------- calculations ---------- */
function expIn(ym){return state.expenses.filter(function(e){return e.date&&e.date.slice(0,7)===ym;});}
function incIn(ym){return state.incomes.filter(function(e){return e.date&&e.date.slice(0,7)===ym;});}
function sumExp(ym){return sum(expIn(ym),function(e){return e.amount;});}
function sumInc(ym){return sum(incIn(ym),function(e){return e.amount;});}
function catTotals(ym){var o={};expIn(ym).forEach(function(e){o[e.cat]=(o[e.cat]||0)+e.amount;});return o;}
function debtPaid(d){return sum(d.payments||[],function(p){return p.amount;});}
function debtLeft(d){return d.closed?0:Math.max(0,r2(d.amount-debtPaid(d)));}
function owedToMe(){return sum(state.debts.filter(function(d){return d.dir==='in';}),debtLeft);}
function iOwe(){return sum(state.debts.filter(function(d){return d.dir==='out';}),debtLeft);}

/* credit cards: a purchase made in month X is charged on the card's billing day in month X+1 */
function cardById(id){if(!id)return null;for(var i=0;i<state.cards.length;i++)if(state.cards[i].id===id)return state.cards[i];return null;}
function billDate(card,ym){return ym+'-'+pad(Math.min(card.billDay,daysIn(ym)));}
function expCharge(e){var c=cardById(e.card);if(!c)return null;return e.chargeDate||billDate(c,addMonths(e.date.slice(0,7),1));}
function nextBill(card,after){var t=after||todayISO(),ym=t.slice(0,7),d=billDate(card,ym);return d>=t?d:billDate(card,addMonths(ym,1));}
function cardLabel(c){if(!c)return '';var n=c.name;if(genericCardName(n)&&issuerOf(c))n=cardShort(c);return (n||'כרטיס')+(c.last4?' ••'+c.last4:'');}
function cardCharge(card,date){
  var items=[];
  state.expenses.forEach(function(e){if(e.card===card.id&&expCharge(e)===date)items.push({label:(e.desc||e.cat),sub:dLabel(e.date)+' · '+e.cat,amount:e.amount});});
  state.future.forEach(function(f){if(f.card!==card.id)return;occurrences(f,date.slice(0,7),date.slice(0,7)).forEach(function(o){if(!o.status&&o.date===date)items.push({label:f.name+(o.total?' ('+o.idx+'/'+o.total+')':''),sub:L('תשלום מתוכנן'),amount:o.amount});});});
  if(card.opening&&card.openingDate===date)items.push({label:L('יתרת חיוב קיימת'),sub:L('הוזנה בעת הוספת הכרטיס'),amount:card.opening});
  return {date:date,items:items,total:sum(items,function(x){return x.amount;})};
}
function cardDebt(card){
  var t=todayISO(),d=0;
  state.expenses.forEach(function(e){if(e.card===card.id){var c=expCharge(e);if(c&&c>=t)d+=e.amount;}});
  state.future.forEach(function(f){if(f.card===card.id&&f.type==='installments')occurrences(f,'1900-01','2200-12').forEach(function(o){if(!o.status&&o.date>=t)d+=o.amount;});});
  if(card.opening&&card.openingDate>=t)d+=card.opening;
  return r2(d);
}
function totalCardDebt(){return sum(state.cards,cardDebt);}
function cardChargesWithin(days){var t=todayISO(),out=[];state.cards.forEach(function(c){var d=nextBill(c);for(var i=0;i<3;i++){if(daysBetween(t,d)<=days){var ch=cardCharge(c,d);if(ch.total)out.push({card:c,date:d,total:ch.total});}d=billDate(c,addMonths(d.slice(0,7),1));}});return out.sort(function(a,b){return a.date<b.date?-1:1;});}
function bankNow(){return state.bankLog.length?state.bankLog[state.bankLog.length-1]:null;}
function sortLog(){state.bankLog.sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:0);});}
function lastManualBank(){for(var i=state.bankLog.length-1;i>=0;i--)if(!state.bankLog[i].auto)return state.bankLog[i];return null;}
/* the day after a card's billing date: deduct that charge from the bank balance (if the charge is on/after the last manual balance update),
   mark card-linked planned payments of that date as paid, and remember it so it never runs twice */
function autoSettle(){
  var t=todayISO(),end=curYM(),pend=[];state.settled=state.settled||{};
  state.cards.forEach(function(card){
    var first=card.created||t;
    state.expenses.forEach(function(e){if(e.card===card.id&&e.date<first)first=e.date;});
    state.future.forEach(function(f){if(f.card===card.id&&f.start<first)first=f.start;});
    var ym=first.slice(0,7);
    for(var g=0;ym<=end&&g<240;g++){var d=billDate(card,ym);if(d<t&&!state.settled[card.id+'|'+d])pend.push({card:card,date:d});ym=addMonths(ym,1);}
  });
  /* fixed monthly incomes: recorded on their day; added to the bank if after the last manual balance update */
  state.incomeDone=state.incomeDone||{};
  (state.recIncome||[]).forEach(function(r){
    var ym=r.start.slice(0,7);
    for(var g=0;ym<=end&&g<240;g++){var d=recDate(r,ym);if(d>=r.start&&d<=t&&!state.incomeDone[r.id+'|'+ym])pend.push({inc:r,ym:ym,date:d});ym=addMonths(ym,1);}
  });
  if(!pend.length)return false;
  pend.sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:0);});
  var base=lastManualBank();
  pend.forEach(function(p){
    if(p.inc){
      state.incomes.push({id:'ri_'+p.inc.id+'_'+p.ym,date:p.date,amount:p.inc.amount,desc:p.inc.name,kind:p.inc.kind||'קצבה',fromRec:p.inc.id});
      var toB=false;
      if(base&&p.date>base.date){var cb=bankNow();state.bankLog.push({date:p.date,amount:r2(cb.amount+p.inc.amount),auto:true,note:L('נכנסה ')+p.inc.name+' '+money(p.inc.amount)});sortLog();toB=true;}
      state.incomeDone[p.inc.id+'|'+p.ym]={bank:toB};
      return;
    }
    var ch=cardCharge(p.card,p.date);
    state.future.forEach(function(f){
      if(f.card!==p.card.id)return;
      occurrences(f,p.date.slice(0,7),p.date.slice(0,7)).forEach(function(o){
        if(o.status||o.date!==p.date)return;
        f.done=f.done||{};f.done[o.ym]='paid';
        state.expenses.push({id:'fo_'+f.id+'_'+o.ym,date:o.date,amount:o.amount,cat:f.cat,desc:f.name+(o.total?' ('+o.idx+'/'+o.total+')':''),fromFuture:f.id+'|'+o.ym,card:p.card.id,chargeDate:o.date});
      });
    });
    var toBank=false;
    if(ch.total>0&&base&&p.date>=base.date){var cur=bankNow();state.bankLog.push({date:p.date,amount:r2(cur.amount-ch.total),auto:true,note:L('ירד חיוב ')+cardLabel(p.card)+' '+money(ch.total)});sortLog();toBank=true;}
    state.settled[p.card.id+'|'+p.date]={amount:r2(ch.total),bank:toBank};
  });
  return true;
}
function recDate(r,ym){return ym+'-'+pad(Math.min(r.day,daysIn(ym)));}
/* expected fixed income not yet received, between today (exclusive) and the given date */
function expectedRecIncome(untilISO){
  var t=todayISO(),s=0,list=[];
  (state.recIncome||[]).forEach(function(r){var ym=t.slice(0,7);for(var g=0;g<14;g++){var d=recDate(r,ym);if(d>untilISO)break;if(d>t&&d>=r.start&&!(state.incomeDone||{})[r.id+'|'+ym]){s+=r.amount;list.push({r:r,date:d});}ym=addMonths(ym,1);}});
  return {total:r2(s),list:list};
}
function monthEnd(ym){return ym+'-'+pad(daysIn(ym));}
function lastSettled(card){var best=null;Object.keys(state.settled||{}).forEach(function(k){var p=k.split('|');if(p[0]===card.id&&state.settled[k].amount>0&&(!best||p[1]>best.date))best={date:p[1],amount:state.settled[k].amount,bank:state.settled[k].bank};});return best;}
function bankProjection(days){
  var t=todayISO(),b=bankNow();if(!b)return null;
  var cardOut=sum(cardChargesWithin(days),function(x){return x.total;});
  var cur=curYM(),end=addMonths(cur,2);
  var planned=sum(allOcc(cur,end).filter(function(o){return !o.status&&!cardById(o.f.card)&&o.date>=t&&daysBetween(t,o.date)<=days;}),function(o){return o.amount;});
  var debts=sum(state.debts.filter(function(d){return d.dir==='out'&&debtLeft(d)>0&&d.due&&d.due>=t&&daysBetween(t,d.due)<=days;}),debtLeft);
  var inc=expectedRecIncome(addDays(t,days)).total,loans=loanDueWithin(days);
  return {start:b.amount,cards:cardOut,planned:planned,debts:debts,loans:loans,income:inc,end:r2(b.amount-cardOut-planned-debts-loans+inc)};
}
/* large loans (kept apart from everyday debts) */
function loanPaid(l){return r2(sum(l.payments||[],function(p){return p.amount;}));}
function loanLeft(l){return Math.max(0,r2(l.total-loanPaid(l)));}
function loansLeft(){return r2(sum(state.loans,loanLeft));}
function loanNextDue(l){
  if(!l.plan||!(l.plan.amount>0)||!loanLeft(l))return null;
  var t=todayISO(),ym=t.slice(0,7),d=ym+'-'+pad(Math.min(l.plan.day,daysIn(ym)));
  var paidThisMonth=(l.payments||[]).some(function(p){return p.date.slice(0,7)===ym;});
  if(paidThisMonth||d<t){ym=addMonths(ym,1);d=ym+'-'+pad(Math.min(l.plan.day,daysIn(ym)));}
  return d;
}
function simText(left,v,cur){var n=Math.ceil(left/v),end=addMonths(curYM(),n);return '<b>'+money(v)+L(' בחודש</b> → ')+n+L(' חודשים, סיום ב')+ymLabel(end)+(cur&&cur!==n?' <span class="'+(n<cur?'pos':'neg')+'">('+(n<cur?(cur-n)+L(' חודשים מוקדם יותר'):(n-cur)+L(' חודשים מאוחר יותר'))+L(' מהתוכנית הנוכחית)</span>'):'');}
function loanFinish(l){var nd=loanNextDue(l);if(!nd)return null;var n=Math.ceil(loanLeft(l)/l.plan.amount);return {months:n,ym:addMonths(nd.slice(0,7),n-1)};}
function loanDueWithin(days){var t=todayISO(),s=0;state.loans.forEach(function(l){var nd=loanNextDue(l);if(nd&&daysBetween(t,nd)<=days)s+=Math.min(l.plan.amount,loanLeft(l));});return r2(s);}
function addDays(iso,n){var d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}

/* future payment occurrences */
function occurrences(f,fromYM,toYM){
  var out=[],startYM=f.start.slice(0,7),day=Number(f.start.slice(8,10))||1;
  var n=f.type==='once'?1:(f.type==='installments'?Math.max(1,f.count|0):600);
  for(var k=0;k<n;k++){
    var ym=addMonths(startYM,k);
    if(ym>toYM)break;
    if(ym<fromYM)continue;
    var cc=cardById(f.card);
    var date=cc?billDate(cc,ym):ym+'-'+pad(Math.min(day,daysIn(ym)));
    var st=(f.done||{})[ym]||null;
    out.push({f:f,ym:ym,date:date,amount:f.amount,idx:k+1,total:f.type==='installments'?n:null,status:st});
  }
  return out;
}
function allOcc(fromYM,toYM){var o=[];state.future.forEach(function(f){o=o.concat(occurrences(f,fromYM,toYM));});return o.sort(function(a,b){return a.date<b.date?-1:1;});}
function plannedUnpaid(ym){return sum(allOcc(ym,ym).filter(function(o){return !o.status;}),function(o){return o.amount;});}
function overdueOcc(){var c=curYM(),t=todayISO();return allOcc('1900-01',c).filter(function(o){return !o.status&&o.date<t;});}

/* ---------- persistence ---------- */
var artifactCap=null,pubTimer=null,status='local',dirty=false;
function save(msg){
  autoSettle();
  state.updatedAt=Date.now();dirty=true;
  try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
  schedulePublish();
  render();
  scheduleReminders();

}
function schedulePublish(){
  if(!artifactCap){status='local';paintStatus();return;}
  if(status==='readonly'){paintStatus();return;}
  status='pending';paintStatus();
  clearTimeout(pubTimer);pubTimer=setTimeout(doPublish,1600);
}
function busyTyping(){var a=document.activeElement;return a&&(a.tagName==='INPUT')&&a.type!=='button'&&a.value&&a.closest('form');}
function doPublish(){
  if(busyTyping()){pubTimer=setTimeout(doPublish,1600);return;}
  status='saving';paintStatus();
  artifactCap.publish(buildDoc()).then(function(){status='saved';dirty=false;paintStatus();},function(e){
    var c=String((e&&(e.code||e.message))||'');
    if(/not_granted|not_writer/.test(c))status='readonly';
    else if(/conflict/.test(c))status='saved';
    else status='error';
    paintStatus();
  });
}
function buildDoc(){

}

/* ---------- recommendations ---------- */
function recs(){
  var out=[],m=curYM(),prev=addMonths(m,-1),t=todayISO();
  var inc=sumInc(m)+expectedRecIncome(monthEnd(m)).total,exp=sumExp(m),planned=plannedUnpaid(m);
  var byCat=catTotals(m),prevCat=catTotals(prev);
  function add(lvl,title,text){out.push({lvl:lvl,title:title,text:text});}
  if(!state.expenses.length&&!state.incomes.length&&!state.debts.length){
    add('info',L('מתחילים'),L('רשום הכנסות והוצאות של החודש (אפילו קטנות). אחרי שבוע-שבועיים של רישום יופיעו כאן המלצות מותאמות לנתונים שלך.'));
  }
  if(inc===0){add('warn',L('לא נרשמה הכנסה החודש'),L('בלי הכנסה אי אפשר לחשב כמה נשאר לך. רשום את ההכנסות של החודש בלשונית "הוצאות והכנסות".'));}
  else{
    var left=inc-exp-planned,rate=left/inc;
    if(left<0)add('bad',L('החודש אתה במינוס צפוי'),L('ההוצאות יחד עם התשלומים הצפויים עד סוף החודש עולות על ההכנסות ב-')+money(-left)+L('. כדאי לעצור הוצאות לא הכרחיות עד סוף החודש, ולבדוק איזה תשלום אפשר לדחות.'));
    else if(rate<0.1)add('warn',L('נשאר לך מעט מההכנסה'),L('אחרי כל ההוצאות והתשלומים הצפויים יישארו בערך ')+money(left)+' ('+pct(rate)+L(' מההכנסה). יעד בריא הוא לחסוך לפחות 10%–20%.'));
    else if(rate>=0.2)add('good',L('חיסכון טוב'),L('צפוי להישאר לך ')+money(left)+' — '+pct(rate)+L(' מההכנסה. כדאי להעביר את הסכום הזה לחיסכון נפרד מיד כשההכנסה נכנסת, כדי שלא "ייעלם".'));
    else add('info',L('מצב סביר'),L('צפוי להישאר לך ')+money(left)+' ('+pct(rate)+L(' מההכנסה). אם תוריד קצת מהקטגוריה הכי גדולה, תגיע ליעד של 20% חיסכון.'));
  }
  var cats=Object.keys(byCat).sort(function(a,b){return byCat[b]-byCat[a];});
  if(exp>0&&cats.length>1&&byCat[cats[0]]/exp>0.3)add('info',L('הקטגוריה הכי גדולה: ')+cats[0],L('היא ')+pct(byCat[cats[0]]/exp)+L(' מכל ההוצאות החודש (')+money(byCat[cats[0]])+L('). חיסכון של 10% בה בלבד = ')+money(byCat[cats[0]]*0.1)+L(' בחודש, ')+money(byCat[cats[0]]*1.2)+L(' בשנה.'));
  Object.keys(state.budgets).forEach(function(c){
    var b=state.budgets[c];if(!b)return;var s=byCat[c]||0;
    if(s>b)add('bad',L('חריגה מתקציב: ')+c,L('הוצאת ')+money(s)+L(' מתוך תקציב של ')+money(b)+L(' (חריגה של ')+money(s-b)+').');
    else if(s>=b*0.8)add('warn',L('קרוב לתקציב: ')+c,L('הוצאת ')+pct(s/b)+L(' מהתקציב (')+money(s)+L(' מתוך ')+money(b)+L('). נשארו ')+money(b-s)+L(' עד סוף החודש.'));
  });
  cats.forEach(function(c){var p=prevCat[c]||0;if(p>=100&&byCat[c]>p*1.25)add('warn',L('עלייה ב')+c,L('החודש כבר הוצאת ')+money(byCat[c])+L(' לעומת ')+money(p)+L(' בכל החודש שעבר (עלייה של ')+pct(byCat[c]/p-1)+').');});

function donut(byCat){
  var keys=Object.keys(byCat).filter(function(k){return byCat[k]>0;}).sort(function(a,b){return byCat[b]-byCat[a];});
  var tot=sum(keys,function(k){return byCat[k];});
  if(!tot)return L('<div class="empty">אין הוצאות רשומות בחודש הזה</div>');
  var R=70,C=2*Math.PI*R,off=0,segs='';
  keys.forEach(function(k){var l=byCat[k]/tot*C;segs+='<circle r="'+R+'" cx="90" cy="90" fill="none" stroke="'+catColor(k)+'" stroke-width="26" stroke-dasharray="'+l+' '+(C-l)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 90 90)"></circle>';off+=l;});
  var svg=L('<svg width="180" height="180" viewBox="0 0 180 180" role="img" aria-label="התפלגות הוצאות">')+segs+L('<text x="90" y="86" text-anchor="middle" font-size="12" fill="#8b8b8b">סה״כ</text><text x="90" y="106" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">')+esc(money(tot))+'</text></svg>';
  var leg='<div class="legend">'+keys.map(function(k){return '<div><span class="dot" style="background:'+catColor(k)+'"></span><span>'+esc(k)+'</span><span class="muted">'+M(byCat[k])+' · '+pct(byCat[k]/tot)+'</span></div>';}).join('')+'</div>';
  return '<div class="donut-wrap">'+svg+leg+'</div>';
}
function monthsChart(n){

  var mx=Math.max.apply(null,list.map(function(x){return Math.max(x.e,x.inc);}).concat([1]));
  return '<div class="months">'+list.map(function(x){
    return L('<div class="m"><div class="bars"><i title="הכנסות ')+esc(money(x.inc))+'" style="height:'+(x.inc/mx*140)+L('px;background:#34d399"></i><i title="הוצאות ')+esc(money(x.e))+'" style="height:'+(x.e/mx*140)+'px;background:#f87171"></i></div><span class="small muted">'+L(MONTHS_HE[Number(x.ym.slice(5))-1]).slice(0,3)+L('׳</span></div>');

function healthScore(){
  var c=curYM(),inc=sumInc(c)+expectedRecIncome(monthEnd(c)).total,exp=sumExp(c),planned=plannedUnpaid(c),parts=[];
  var avgI=avgIncome();
  /* budget: how much of the income the month's spending takes */
  if(inc>0){var r=(exp+planned)/inc,sc=Math.round(100*clamp01((1.1-r)/0.4)),over=Object.keys(state.budgets).filter(function(k){return (catTotals(c)[k]||0)>state.budgets[k];});
    sc=Math.max(0,sc-over.length*8);
    parts.push({k:L('תקציב'),v:sc,d:L('ההוצאות החודש (כולל צפויות) הן ')+pct(r)+L(' מההכנסה')+(over.length?L(' · חריגה ב')+over.join(', '):'')+'.'});}
  /* savings rate */
  if(inc>0){var sr=(inc-exp-planned)/inc,sv=Math.round(100*clamp01(sr/0.2));
    parts.push({k:L('חיסכון'),v:sv,d:sr>=0.2?L('נשאר ')+pct(sr)+L(' מההכנסה — מעל היעד של 20%.'):L('צפוי להישאר ')+pct(Math.max(0,sr))+L(' מההכנסה. היעד: 20%.')});}
  /* debts */
  var liab=iOwe()+totalCardDebt()+loansLeft();
  if(avgI>0&&(liab>0||state.debts.length||state.loans.length||state.cards.length)){
    var nm=addMonths(c,1),inst=sum(allOcc(nm,nm).filter(function(o){return o.f.type==='installments';}),function(o){return o.amount;})+loanSchedule(2)[1];
    var dti=inst/avgI,tdi=liab/(avgI*12),s1=clamp01((0.6-dti)/0.3),s2=clamp01((2-tdi)/1.5),dv=Math.round(100*(s1+s2)/2);
    parts.push({k:L('חובות'),v:dv,d:L('חוב כולל ')+money(liab)+' = '+pct(tdi)+L(' מהכנסה שנתית · החזרים קבועים ')+pct(dti)+L(' מההכנסה.')});}
  /* safety: cushion + goals */
  var b=bankNow(),ae=avgExpense();

    var v=Math.round(100*(gv==null?cv:(cv*0.6+gv*0.4)));
    parts.push({k:gs.length?L('ביטחון ויעדים'):L('כרית ביטחון'),v:v,d:L('היתרה מכסה ')+(Math.round(cm*10)/10)+L(' חודשי הוצאות (יעד: 3)')+(gs.length?L(' · התקדמות ביעדים ')+pct(gv):'')+'.'});}
  if(!parts.length)return null;
  var total=Math.round(sum(parts,function(x){return x.v;})/parts.length);
  return {total:total,parts:parts};
}

function md(t){
  var lines=String(t||'').split('\n'),out=[],list=null,table=null;
  function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');}
  function close(){if(list){out.push('</'+list+'>');list=null;}if(table){out.push('<div class="tablewrap"><table>'+table.map(function(r,i){return '<tr>'+r.map(function(c){return i===0?'<th>'+inl(c)+'</th>':'<td>'+inl(c)+'</td>';}).join('')+'</tr>';}).join('')+'</table></div>');table=null;}}
  lines.forEach(function(l){var s=l.trim();
    if(/^\|/.test(s)){if(list){out.push('</'+list+'>');list=null;}if(/^\|[\s:\-|]+\|$/.test(s))return;table=table||[];table.push(s.replace(/^\||\|$/g,'').split('|').map(function(x){return x.trim();}));return;}
    if(table)close();
    var m;
    if((m=s.match(/^#{1,3}\s+(.*)/))){close();out.push('<h3 style="margin-top:18px;color:var(--brand)">'+inl(m[1])+'</h3>');}
    else if((m=s.match(/^[-*•]\s+(.*)/))){if(list!=='ul'){close();out.push('<ul>');list='ul';}out.push('<li>'+inl(m[1])+'</li>');}
    else if((m=s.match(/^\d+[.)]\s+(.*)/))){if(list!=='ol'){close();out.push('<ol>');list='ol';}out.push('<li>'+inl(m[1])+'</li>');}
    else if(!s){close();}
    else{close();out.push('<p>'+inl(s)+'</p>');}
  });
  close();return out.join('');
}

function nlCommit(fd){
  var amt=r2(parseFloat(fd.amount)),type=fd.type;

  if(!(amt>0)){toast(L('חסר סכום'));return false;}
  if(type==='exp'){
    var c=cardById(fd.card);if(fd.cat&&state.categories.indexOf(fd.cat)<0)state.categories.push(fd.cat);
    state.expenses.push({id:uid(),date:fd.date,amount:amt,cat:fd.cat||'אחר',desc:fd.desc,card:c?c.id:''});
    if(c)ui.lastCard=c.id;ui.nl=null;save(c?L('נרשם ב')+cardLabel(c)+L(' — יחויב ב-')+dLabel(expCharge(state.expenses[state.expenses.length-1])):L('ההוצאה נרשמה'));return true;}
  if(type==='inc'){state.incomes.push({id:uid(),date:fd.date,amount:amt,desc:fd.desc||fd.kind,kind:fd.kind||'אחר'});ui.nl=null;save(L('ההכנסה נרשמה'));return true;}
  if(type==='debtin'||type==='debtout'){if(!fd.person){toast(L('חסר שם'));return false;}state.debts.push({id:uid(),person:fd.person,dir:type==='debtin'?'in':'out',amount:amt,desc:fd.desc,date:fd.date,due:'',payments:[]});ui.nl=null;save(L('החוב נרשם'));return true;}
  return false;
}

function wizValidate(st){

    var bal=r2(Number(d.bal)),cur=bankNow();
    if(!cur||cur.amount!==bal||cur.date!==todayISO()){if(!cur||cur.amount!==bal){state.bankLog.push({date:todayISO(),amount:bal});sortLog();}}
    state.bankInfo=Object.assign({},state.bankInfo||{},{limit:r2(Number(d.limit)),bank:d.bank||'',updated:new Date().toISOString()});
    save();return true;
  }
  if(st==='cards'){
    if(state.cards.some(function(c){return !c.issuer;})){ui.wizErr='בחר חברת אשראי לכל כרטיס';return false;}
    if(!state.cards.length&&d.noCards!=='yes'){ui.wizErr='הוסף כרטיס, או סמן "אין לי כרטיס אשראי"';return false;}

    return true;
  }
  return true;
}

/* ---------- expert metrics ---------- */
function proMetrics(){
  var c=curYM(),ms=activeMonths(),inc=avgIncome(),exp=avgActive(sumExp)||extrapolate(sumExp),b=bankNow(),bank=b?b.amount:0;
  var fixed=sum(fixedMonthly(),function(x){return x.a;}),liab=iOwe()+totalCardDebt()+loansLeft(),assets=bank+owedToMe()+goalsSaved();
  var vals=ms.map(sumExp),mean=vals.length?sum(vals)/vals.length:0,sd=vals.length>1?Math.sqrt(sum(vals,function(v){return (v-mean)*(v-mean);})/vals.length):0;
  var cats={},tot=0;ms.forEach(function(ym){expIn(ym).forEach(function(e){cats[e.cat]=(cats[e.cat]||0)+e.amount;tot+=e.amount;});});
  var hhi=tot?sum(Object.keys(cats),function(k){var s=cats[k]/tot;return s*s;}):0;
  var nm=addMonths(c,1),debtSvc=sum(allOcc(nm,nm).filter(function(o){return o.f.type==='installments';}),function(o){return o.amount;})+loanSchedule(2)[1];
  var out30=bankProjection(30),usd=usdExposure();
  var rows=[
    ['שיעור חיסכון (ממוצע)',inc?pct((inc-exp)/inc):'—','(הכנסה − הוצאה) ÷ הכנסה'],
    ['קצב שריפה (Burn rate)',money(Math.round(exp)),'הוצאה חודשית ממוצעת'],
    ['Runway',exp>0&&b?(Math.round(bank/exp*10)/10)+' '+L('חודשים'):'—','יתרה ÷ קצב שריפה'],
    ['יחס עלויות קבועות',inc?pct(fixed/inc):'—','קבועות ÷ הכנסה'],
    ['יחס שירות חוב (DSR)',inc?pct(debtSvc/inc):'—','החזרים חודשיים ÷ הכנסה'],
    ['מינוף (חוב ÷ הכנסה שנתית)',inc?pct(liab/(inc*12)):'—','התחייבויות ÷ הכנסה×12'],
    ['שווי נקי',money(Math.round(assets-liab)),'נכסים − התחייבויות'],
    ['נזילות 30 יום',out30?money(Math.round(out30.end)):'—','יתרה + תקבולים − תשלומים ידועים'],
    ['תנודתיות הוצאות (CV)',mean?pct(sd/mean):'—','סטיית תקן ÷ ממוצע חודשי'],
    ['ריכוזיות קטגוריות (HHI)',tot?Math.round(hhi*10000):'—','0–10,000; מעל 2,500 = ריכוזי'],
    ['חשיפה מט״ח (USD)',money(usd)+(exp?' · '+pct(usd/exp):''),'חיובים צמודי דולר בחודש'],
    ['ריבית ריאלית בחשבון',fin.boi!=null&&fin.cpiYTD!=null?(Math.round((fin.boi-fin.cpiYTD)*100)/100)+'%':'—','ריבית בנק ישראל − מדד מתחילת השנה']
  ];
  return '<div class="rep"><div class="rep-head"><h2 class="rep-title">'+L('מדדים מתקדמים')+'</h2><span class="rep-sub">'+L('מצב מקצוען')+'</span></div><table class="ledger"><thead><tr><th>'+L('מדד')+'</th><th class="n">'+L('ערך')+'</th><th>'+L('חישוב')+'</th></tr></thead><tbody>'+
    rows.map(function(r){return '<tr class="ind"><td>'+L(r[0])+'</td><td class="n"><b>'+r[1]+'</b></td><td class="small muted">'+L(r[2])+'</td></tr>';}).join('')+'</tbody></table></div>';
}

asks for bagrut).","Не нужен: достаточно 12 лет учёбы (в Оно просят и багрут)."],"psy":["לא נדרש","Not required","Не требуется"],"age":["בוגר/ת (18+)","Adult (18+)","Взрослый (18+)"],"pre":["אזרח/ית או תושב/ת ישראל. שליטה בעברית ובאנגלית. בלי הרשעה או כתב אישום בעבירה חמורה.","Israeli citizen or resident. Good Hebrew and English. No conviction or indictment for a serious offence.","Гражданство или вид на жительство Израиля. Владение ивритом и английским. Без судимости или обвинения в тяжком преступлении."],"lic":["בחינת גמר בכתב של מוסד ההכשרה, באישור משרד הבריאות. ציון עובר: 70 בסך הכול ולפחות 70% בשאלות של תוכן באנגלית. אחר כך רישום בפנקס טכנאי בית מרקחת של משרד הבריאות.","Written final exam by the training institution, approved by the Ministry of Health. Pass: 70 overall and at least 70% on the English-content questions. Then entry in the MoH pharmacy-technician registry.","Письменный выпускной экзамен учебного заведения, утверждённый Минздравом. Проходной: 70 в целом и не менее 70% по вопросам на английском. Затем запись в реестр техников аптек Минздрава."],"sub":["לא נמצא מימון מיוחד. כדאי לבדוק שוברי הכשרה של משרד העבודה, והאם רשת המעסיק מממנת את הקורס (לא נבדק).","None specific found. Check Labour Ministry training vouchers and whether the employer chain sponsors the course (not verified).","Специальных льгот не найдено. Проверьте ваучеры Минтруда на обучение и не оплачивает ли курс сеть-работодатель (не проверено)."],"dur":["עיוני: 200 שעות (180 בעברית + 20 באנגלית), 4.5 חודשים (Success Pharm) עד 8 (לימודי חוץ). מעשי: 400 שעות בבית מרקחת, 10-20 שבועות; רק 200 למי שעבד בבית מרקחת 30+ שעות בשבוע שנה אחת ב-3 השנים האחרונות.","Theory: 200 hours (180 Hebrew + 20 English), 4.5 months (Success Pharm) to 8 (Limudey Hutz). Practice: 400 hours in a pharmacy, 10-20 weeks; only 200 if you worked 30+ h/week in a pharmacy for 1 of the last 3 years.","Теория: 200 ч (180 на иврите + 20 на английском), от 4.5 мес. (Success Pharm) до 8 (Лимудей Хуц). Практика: 400 ч в аптеке, 10-20 недель; 200 ч, если вы работали в аптеке от 30 ч/нед. 1 год из последних 3."],"costInc":["רק הקורס העיוני. Success Pharm: 5,500 ₪ בלי תוספות. לימודי חוץ / ת״א-יפו: מחירון 8,500 ₪, 6,200 ₪ בהרשמה באינטרנט, עד 12 תשלומים. אונו לא מפרסמת מחיר. ההכשרה המעשית היא לרוב עבודה בשכר (רגיל או מופחת).","Theory course only. Success Pharm: ₪5,500, no extra fees. Limudey Hutz / Tel Aviv-Yafo: ₪8,500 list, ₪6,200 online, up to 12 payments. Ono: no price published. Practical training is often paid work (regular or reduced wages).","Только теория. Success Pharm: 5,500 ₪ без доплат. Лимудей Хуц / Тель-Авив-Яффо: 8,500 ₪ по прайсу, 6,200 ₪ онлайн, до 12 платежей. Оно цену не публикует. Практика часто оплачивается (обычная или сниженная зарплата)."],"diffWhy":["כ-600 שעות, בלי בגרות ובלי פסיכומטרי, אבל יש מבחן עם תוכן באנגלית וציון עובר 70.","About 600 hours, no bagrut or psychometric, but an exam with English content and a pass mark of 70.","Около 600 часов, без багрута и психометрии, но экзамен с вопросами на английском и проходным баллом 70."],"work":["בערבים (לימודי חוץ: שני ורביעי 17:00-20:15, היברידי בזום). Success Pharm: 1-2 מפגשים בשבוע, מוקלטים. עובדי בית מרקחת יכולים לעשות את המעשי במקום העבודה וצריכים רק 200 שעות.","Evenings (Limudey Hutz: Mon+Wed 17:00-20:15, hybrid with Zoom). Success Pharm: 1-2 recorded sessions a week. Pharmacy staff can do the practical part at their workplace and need only 200 hours.","Вечером (Лимудей Хуц: пн+ср 17:00-20:15, гибрид с Zoom). Success Pharm: 1-2 занятия в неделю, с записью. Работники аптек могут пройти практику на своей работе, им нужно только 200 часов."]}},"b_pharm":{"n":["תואר ברוקחות + סטאז׳ + רישיון רוקח","Pharmacy degree + internship + licence","Степень по фармации + стажировка + лицензия"],"tg":["pharmacist"],"ty":"degree","co":false,"c":[42588,53088,true],"dt":["3.5 שנים + חצי שנה התמחות","3.5 years + 6-month internship","3,5 года + 6 месяцев стажировки"],"df":5,"rq":["בגרות (בב״ג: מתמטיקה 5 יח״ל 60+ או 4 יח״ל 80+), פסיכומטרי 600+, ראיון בבן-גוריון.","Bagrut (BGU: math 5 units 60+ or 4 units 80+), psychometric 600+, interview at BGU.","Багрут (БГУ: математика 5 ед. от 60 или 4 ед. от 80), психометрия 600+, собеседование в БГУ."],"wk":["לא: לימודי יום מלאים, לכל היותר משמרות חלקיות.","No: full-time day study, part-time shifts at most.","Нет: дневная учёба, максимум подработка сменами."],"src":[["HUJI info site: Pharmacy (admission, duration)","https://info.huji.ac.il/bachelor/School-Of-Pharmacy","2026/27 admission cycle; accessed 2026-11-03"],["HUJI School of Pharmacy: B.Sc.Pharm","https://schoolofpharmacy.huji.ac.il/bsc","no page date; accessed 2026-11-03"],["HUJI registration grid: pharmacy tracks 2026/27","https://info.huji.ac.il/courses/first-degree/cluster/178/grid/%D7%A8","2026/27; accessed 2026-11-03"]],"x":{"inst":{"he":["האוניברסיטה העברית, בית הספר לרוקחות (עין כרם)","אוניברסיטת בן-גוריון, הפקולטה למדעי הבריאות"],"en":["Hebrew University of Jerusalem, School of Pharmacy (Ein Kerem)","Ben-Gurion University of the Negev, Faculty of Health Sciences"],"ru":["Еврейский университет, Школа фармации (Эйн-Карем)","Университет Бен-Гуриона, факультет наук о здоровье"]},"notOffered":["באוניברסיטת אריאל אין לימודי רוקחות. היא לא מופיעה באף רשימה שנבדקה: ב-study.co.il מופיעות רק העברית ובן-גוריון, ובסיכום הקבלה של אריאל אין רוקחות.","Ariel University does not offer pharmacy. It is not on any listing checked: study.co.il lists only HUJI and BGU, and Ariel's admissions summary has no pharmacy program.","В Университете Ариэля нет фармации. Её нет ни в одном проверенном списке: на study.co.il только Еврейский ун-т и БГУ, в сводке приёма Ариэля фармации нет."],"bagrut":["בן-גוריון: מתמטיקה 5 יח״ל בציון 60+ או 4 יח״ל בציון 80+. האוניברסיטה העברית, קבלה ישירה: ממוצע בגרות 11.30 (10.95 – זכאות לקידום).","BGU: math 5 units at 60+ or 4 units at 80+. HUJI direct admission: bagrut average 11.30 (10.95 eligible for promotion).","БГУ: математика 5 ед. от 60 или 4 ед. от 80. Еврейский ун-т, прямой приём: средний балл багрута 11.30 (10.95 — право на продвижение)."],"psy":["בן-גוריון: פסיכומטרי 600+ וסכם 680+. העברית: מינימום 600 עם דגש כמותי; קבלה ישירה 725; סף משוקלל 22.500 (שנה לא צוינה). אנגלית: מתקדמים א׳.","BGU: psychometric 600+ and sechem 680+. HUJI: minimum 600 with a quantitative emphasis; direct admission 725; weighted threshold 22.500 (year not stated). English: Advanced A.","БГУ: психометрия от 600 и сехем от 680. Еврейский ун-т: минимум 600 с упором на количественную часть; прямой приём 725; взвешенный порог 22.500 (год не указан). Английский: Advanced A."],"age":["","",""],"pre":["בן-גוריון: ראיון אישי. האוניברסיטה העברית: הצהרת בריאות, ויש בה גם מסלול הסבה לבעלי B.Sc. רלוונטי (2026/27).","Personal interview at BGU. HUJI: health declaration. HUJI also has a retraining track for holders of a relevant B.Sc. (2026/27).","БГУ: личное собеседование. Еврейский ун-т: декларация о здоровье. Там же есть программа переквалификации для обладателей профильного B.Sc. (2026/27)."],"lic":["רישיון רוקח של משרד הבריאות אחרי התואר והסטאז׳. העברית ובן-גוריון לא מציינות בחינה ממשלתית לבוגרים בישראל. בחינות רישוי ממשלתיות מתועדות לרוקחים שלמדו בחו״ל (כל זכות).","Ministry of Health pharmacist licence after the degree and internship. HUJI and BGU name no government exam for Israeli graduates. Government exams are documented for foreign-trained pharmacists (Kol Zchut).","Лицензия фармацевта Минздрава после диплома и стажа. Еврейский ун-т и БГУ не называют госэкзамен для израильских выпускников. Госэкзамены описаны для фармацевтов с дипломом из-за рубежа (Коль Зхут)."],"sub":["פיקדון ומענקים לחיילים משוחררים (כללי). לא נמצאה מלגה מיוחדת לרוקחות.","Discharged-soldier deposit and grants (general). No pharmacy-specific scholarship verified.","Депозит и гранты для демобилизованных солдат (общие). Стипендии именно для фармации не найдено."],"dur":["העברית: 3.5 שנים (7 סמסטרים) + סטאז׳ של 6 חודשים (בעמוד בית הספר: תוכנית של 4 שנים). בן-גוריון: 198 נקודות זכות + 6 חודשי הכשרה מעשית. יש אתרים שכותבים 8 חודשים; העמודים הרשמיים כותבים 6.","HUJI: 3.5 years (7 semesters) + a 6-month internship (the School of Pharmacy page says 4 years). BGU: 198 credits + 6 months of practical training. Some sites say 8 months; the official HUJI and BGU pages say 6.","Еврейский ун-т: 3.5 года (7 семестров) + стаж 6 мес. (на сайте школы — 4 года). БГУ: 198 кредитов + 6 мес. практики. Некоторые сайты пишут 8 мес.; официальные страницы университетов — 6."],"costInc":["שכר לימוד בלבד. 3.5 עד 4 שנים לפי התעריף המופחת של המל״ג ל-2026/27 (12,168 ₪ בסיס, או 13,272 ₪ עם התשלומים הקבועים של ת״א). התעריף ב-2025/26: 12,017 ₪. בלי הוצאות מחיה.","Tuition only. 3.5 to 4 years at the CHE reduced rate for 2026/27 (₪12,168 base, or ₪13,272 with TAU fixed fees). The 2025/26 rate was ₪12,017. Living costs not included.","Только обучение. 3.5-4 года по сниженному тарифу МАЛАГ на 2026/27 (12,168 ₪ база или 13,272 ₪ с фикс. сборами ТАУ). Тариф 2025/26: 12,017 ₪. Проживание не входит."],"diffWhy":["פסיכומטרי 600+ (קבלה ישירה לעברית: 725), הרבה מתמטיקה ומדעים, לימודים מלאים 3.5-4 שנים + סטאז׳.","Psychometric 600+ (HUJI direct admission 725), heavy math and science, full-time 3.5-4 years plus internship.","Психометрия от 600 (прямой приём в Еврейский ун-т — 725), много математики и естественных наук, дневная учёба 3.5-4 года + стаж."],"work":["לא נמצא מסלול ערב או סוף שבוע. לימודי יום מלאים; לכל היותר משמרות חלקיות. ההרשמה לשנת 2026/27 בעברית סגורה; ההרשמה לסמסטר ב׳ נפתחת ב-3.1.2027.","No evening or weekend track found. Full-time day program; at most part-time shifts. HUJI registration for 2026/27 is closed; second-semester registration opens 2027-01-03.","Вечерней программы или программы выходного дня не найдено. Дневная учёба; максимум частичные смены. Запись на 2026/27 в Еврейский ун-т закрыта; на 2-й семестр откроется 03.01.2027."]}},"practical_eng_electrical":{"n":["הנדסאי/ת חשמל (מה״ט)","Electrical practical engineer (MAHAT)","Практический инженер-электрик (МАХАТ)"],"tg":["electrical_ 3 יח״ל) ועברית (2 יח״ל), או מכינה טכנולוגית של 660 שעות. גיל 30-35: מעבר במתמטיקה. 35+: 12 שנות לימוד.","Full bagrut, or partial bagrut with 55+ in math (3 units), English (3 units) and Hebrew (2 units), or a 660-hour technological prep course. Ages 30-35: a pass in math. 35+: 12 years of schooling.","Полный багрут, или частичный с 55+ по математике (3 ед.), английскому (3 ед.) и ивриту (2 ед.), или технологическая мехина на 660 часов. Возраст 30-35: сдана математика. 35+: 12 лет учёбы."],"psy":["לא נדרש","Not required","Не требуется"],"age":["","",""],"pre":["","",""],"lic":["בחינות מה״ט פנימיות וחיצוניות + פרויקט גמר. סולם רישיונות (CTS): חשמלאי מוסמך עד 3x80A בסיום; חשמלאי ראשי עד 3x250A אחרי שנה; רישיון הנדסאי עד 3x630A אחרי שנתיים ניסיון.","MAHAT internal and external exams + final project. Licence ladder (CTS): licensed electrician up to 3x80A on graduation; chief electrician up to 3x250A after 1 year; practical engineer up to 3x630A after 2 years of experience.","Внутренние и внешние экзамены МАХАТ + дипломный проект. Лицензии (CTS): электрик-мусмах до 3x80A при выпуске; главный электрик до 3x250A через 1 год; практический инженер до 3x630A после 2 лет опыта."],"sub":["חיילים משוחררים: שכר לימוד מופחת (אורט בראודה: 7,652 ₪ לשנתיים במסלול יום); תשלום מפיקדון השחרור (CTS). מילואימניקים פעילים: מלגה של 10% משכר הלימוד הבסיסי (בראודה). עולים חדשים: ייתכן סיוע ממשרד הקליטה (CTS).","Discharged soldiers: reduced tuition (ORT Braude: ₪7,652 for 2 day years); pay from the personal deposit (CTS). Active reservists: 10% scholarship on basic tuition (ORT Braude). New immigrants: possible Absorption Ministry help (CTS).","Демобилизованные: сниженная плата (ОРТ Брауде: 7,652 ₪ за 2 года днём); оплата из личного депозита (CTS). Резервисты: стипендия 10% от базовой платы (Брауде). Репатрианты: возможна помощь Минабсорбции (CTS)."],"dur":["יום: שנתיים (4 סמסטרים, 4 ימים בשבוע). ערב: 3 שנים (אריאל: 9 סמסטרים, 2 ערבים + שישי בבוקר; CTS: 3 ערבים בשבוע, 6 סמסטרים רגילים + 3 סמסטרי קיץ).","Day: 2 years (4 semesters, 4 days a week). Evening: 3 years (Ariel: 9 semesters, 2 evenings + Friday morning; CTS: 3 evenings a week, 6 regular + 3 summer semesters).","Днём: 2 года (4 семестра, 4 дня в неделю). Вечером: 3 года (Ариэль: 9 семестров, 2 вечера + пятница утром; CTS: 3 вечера в неделю, 6 обычных + 3 летних семестра)."],"costInc":["שכר לימוד כולל נלווים (אורט בראודה, 2025/26): יום 23,826 ₪ (משוחרר 7,652); ערב 29,551 ₪ (משוחרר 16,045). תוספות ב-CTS (2026/27): הרשמה 300, בחינת מה״ט 237 לבחינה, הנחיית פרויקט 1,800, הגנה 237. אריאל ו-CTS לא מפרסמות שכר לימוד.","Tuition incl. fees (ORT Braude, 2025/26): day ₪23,826 (discharged soldier 7,652); evening ₪29,551 (16,045). CTS extras (2026/27): registration 300, MAHAT exam 237 each, project supervision 1,800, defence 237. Ariel/CTS: price not published.","Обучение со сборами (ОРТ Брауде, 2025/26): день 23,826 ₪ (демобил. 7,652); вечер 29,551 ₪ (16,045). Доп. в CTS (2026/27): запись 300, экзамен МАХАТ 237 каждый, руков. проекта 1,800, защита 237. Ариэль и CTS цену не публикуют."],"diffWhy":["הרבה מתמטיקה ופיזיקה ובחינות מה״ט ארציות, אבל בלי פסיכומטרי.","Math and physics heavy, with national MAHAT exams, but no psychometric.","Много математики и физики, общенациональные экзамены МАХАТ, но без психометрии."],"work":["מסלול ערב של 3 שנים (אריאל: 2 ערבים + שישי בבוקר; CTS: 3 ערבים).","Evening track over 3 years (Ariel: 2 evenings + Friday morning; CTS: 3 evenings).","Вечерняя программа на 3 года (Ариэль: 2 вечера + пятница утром; CTS: 3 вечера)."]}},"bsc_electrical_eng":{"n":["תואר בהנדסת חשמל ואלקטרוניקה (B.Sc.)","Electrical & electronics engineering (B.Sc.)","Электротехника и электроника (B.Sc.)"],"tg":["electrical_eng"],"ty":"degree","co":false,"c":[48068,53088,true],"dt":["כ-4 שנים","About 4 years","Около 4 лет"],"df":5,"rq":["אריאל: מתמטיקה 5 יח״ל 75+ או 4 יח״ל 88+, פיזיקה 5 יח״ל 78+, סכם 620+; או מכינה בממוצע 87+.","Ariel: math 5 units 75+ or 4 units 88+, physics 5 units 78+, combined score 620+; or mec function occMatch(res,k){
  var o=CAREER_DB.occ[k];if(!o||!o.r)return 0;var letters='RIASEC'.split(''),u=letters.map(function(l){return res.riasec[l];});
  var mu=u.reduce(function(a,b){return a+b;},0)/6,w=[3,2,1],ov=letters.map(function(l){var i=o.r.indexOf(l);return i>=0?w[i]||1:0;}),mo=ov.reduce(function(a,b){return a+b;},0)/6;
  var num=0,du=0,dv=0;for(var i=0;i<6;i++){num+=(u[i]-mu)*(ov[i]-mo);du+=(u[i]-mu)*(u[i]-mu);dv+=(ov[i]-mo)*(ov[i]-mo);}
  var cos=du&&dv?num/Math.sqrt(du*dv):0,lvl=(res.riasec[o.r[0]]||0)/100;
  var s=50+40*cos+10*(lvl-0.5)*2,b=res.big5,g=o.g;
  if(g==='health'||g==='care'||g==='education')s+=(b.A-50)/25;
  if(g==='business'||g==='tech')s+=(b.C-50)/25;
  if(g==='creative')s+=(b.O-50)/25;
  if(['tele_sales','retail_sales','real_estate_agent','insurance_agent','waiter','bartender'].indexOf(k)>=0)s+=(b.E-50)/25;
  if(['nurse','paramedic','call_center','security_guard','tele_sales'].indexOf(k)>=0)s-=Math.max(0,b.N-60)/20;
  return Math.max(5,Math.min(98,Math.round(s)));
}

/* ---------- salary month vs month ---------- */
function workIncome(ym){return r2(sum(incIn(ym).filter(function(e){return (e.kind||'')==='עבודה';}),function(e){return e.amount;}));}
function salaryCompare(){
  var c=curYM(),months=[];for(var i=5;i>=0;i--)months.push(addMonths(c,-i));
  var vals=months.map(workIncome);if(!vals.some(function(v){return v>0;}))return null;
  var cur=vals[5],prev=vals[4],prev2=vals[3],partial=true;
  /* this month has no pay yet → compare the last two full months */
  if(!(cur>0)){partial=false;return {months:months,vals:vals,a:prev,b:prev2,aym:months[4],bym:months[3],partial:false};}
  return {months:months,vals:vals,a:cur,b:prev,aym:c,bym:months[4],partial:Number(todayISO().slice(8,10))<daysIn(c)};
}
