name: Android app (APK)
on:
  push:
    branches: [main]
    paths: ['index.html', 'sw.js', 'manifest.webmanifest', 'icons/**', 'assets/**', 'capacitor.config.json', 'package.json', 'version.json', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Copy the web app
        run: |
          mkdir -p www
          cp index.html sw.js manifest.webmanifest market.json version.json www/
          cp -r icons www/
      - name: Create the Android project
        run: npx cap add android && npx cap sync android
      - name: Notification permission
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $M || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' $M
          grep -n "uses-permission" $M
      - name: App icon
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#111111' --iconBackgroundColorDark '#111111' --splashBackgroundColor '#111111' --splashBackgroundColorDark '#111111' || echo "icon step skipped"
      - name: Version number
        id: ver
        run: |
          V=$(python3 -c "import json;print(json.load(open('version.json'))['v'])")
          CODE=$(( $(date +%s) / 60 - 29000000 ))
          sed -i -E "s/versionCode [0-9]+/versionCode $CODE/; s/versionName \"[^\"]+\"/versionName \"$V\"/" android/app/build.gradle
          echo "v=$V" >> "$GITHUB_OUTPUT"
      - name: Build
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon assembleRelease assembleDebug
      - name: Sign with the app's permanent key (so updates keep your data)
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          U=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ks.jks
            "$ANDROID_HOME/build-tools/$BT/zipalign" -f -p 4 "$U" aligned.apk
            "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks ks.jks --ks-key-alias kesef --ks-pass env:KS_PASS --key-pass env:KS_PASS --out "kesef-app.apk" aligned.apk
            rm -f ks.jks
          else
            echo "::warning::No signing key secret — publishing a DEBUG build. Updates may require reinstalling."
            cp android/app/build/outputs/apk/debug/*.apk kesef-app.apk
          fi
          ls -la kesef-app.apk
      - uses: actions/upload-artifact@v4
        with: { name: kesef-app-apk, path: kesef-app.apk }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: הכסף שלי ${{ steps.ver.outputs.v }}
          body: "להתקנה בטלפון אנדרואיד: הורד את kesef-app.apk ופתח אותו. בפעם הראשונה הטלפון יבקש לאשר התקנה ממקור לא מוכר."
          files: kesef-app.apk
          make_latest: true
